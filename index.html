<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<meta name="description" content="时家奇门遁甲排盘 · 拆补法 · 纯前端单文件" />
<title>奇门遁甲 · 时家拆补排盘</title>
<link rel="preconnect" href="https://registry.npmmirror.com" crossorigin />
<link rel="stylesheet" href="https://registry.npmmirror.com/@fontsource/noto-serif-sc/5.3.1/files/400.css" />
<link rel="stylesheet" href="https://registry.npmmirror.com/@fontsource/noto-serif-sc/5.3.1/files/700.css" />
<style>
:root{
  --paper:#f7f2e4;
  --paper-2:#f2ead7;
  --paper-3:#fbf7ec;
  --ink:#23201a;
  --ink-2:#4e4739;
  --ink-3:#8b8069;
  --line:#cbbfa6;
  --line-2:#e2d8c2;
  --red:#9a3327;
  --red-2:#b4483a;
  --gold:#a1864f;
  --serif:"Noto Serif SC","Source Han Serif SC","Source Han Serif CN","Songti SC","STSong","SimSun","Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  color:var(--ink);
  font-family:var(--serif);
  background:
    radial-gradient(1100px 520px at 50% -8%, #fdfaf1 0%, rgba(253,250,241,0) 62%),
    radial-gradient(700px 480px at 108% 104%, #efe3c9 0%, rgba(239,227,201,0) 62%),
    linear-gradient(180deg,#f8f3e6 0%,#f3ecda 58%,#ece1ca 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
.paper-grain{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;
  background-image:
    repeating-linear-gradient(97deg, rgba(120,100,70,.045) 0 1px, rgba(120,100,70,0) 1px 3px),
    repeating-linear-gradient(7deg, rgba(120,100,70,.03) 0 1px, rgba(120,100,70,0) 1px 4px),
    radial-gradient(120% 90% at 50% 40%, rgba(255,255,255,0) 55%, rgba(120,92,48,.10) 100%);
  mix-blend-mode:multiply;
}
.wrap{position:relative;z-index:1;max-width:740px;margin:0 auto;padding:26px 18px 56px}

/* ---------- 页眉 ---------- */
.masthead{text-align:center;margin:6px 0 20px}
.brand{display:flex;align-items:center;justify-content:center;gap:14px}
.seal{
  width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;
  background:var(--red);color:#fbf1de;font-size:25px;font-weight:700;
  border-radius:3px;transform:rotate(-2.5deg);
  box-shadow:0 4px 10px rgba(122,43,33,.28), inset 0 0 0 1px rgba(255,235,205,.35);
}
h1{
  margin:0;font-size:clamp(23px,6.2vw,31px);font-weight:700;
  letter-spacing:.32em;text-indent:.32em;line-height:1.15;
}
.sub{margin:7px 0 0;font-size:11.5px;letter-spacing:.26em;text-indent:.26em;color:var(--ink-3)}
.verse{
  margin:16px auto 0;max-width:520px;font-size:12.5px;line-height:2;color:var(--ink-3);
  letter-spacing:.06em;
}
.divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px auto 0;max-width:260px}
.divider::before,.divider::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,rgba(160,140,100,0),var(--line))}
.divider::after{background:linear-gradient(90deg,var(--line),rgba(160,140,100,0))}
.divider i{width:5px;height:5px;transform:rotate(45deg);background:var(--red);opacity:.75}

/* ---------- 面板 ---------- */
.panel{
  position:relative;
  background:linear-gradient(180deg,rgba(255,253,246,.86),rgba(250,244,231,.72));
  border:1px solid var(--line-2);
  border-radius:3px;
  box-shadow:0 1px 0 rgba(255,255,255,.75) inset, 0 10px 26px rgba(84,62,30,.07);
  padding:16px;
  margin-bottom:16px;
}
.panel::after{
  content:"";position:absolute;inset:4px;border:1px solid rgba(163,142,102,.16);
  border-radius:2px;pointer-events:none;
}

/* ---------- 时间选择 ---------- */
.time-panel{display:flex;flex-direction:column;gap:14px}
.fields{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.field{display:flex;flex-direction:column;align-items:center;gap:5px;border-bottom:1px solid var(--line-2);padding:2px 0 5px}
.field span{font-size:10.5px;letter-spacing:.22em;text-indent:.22em;color:var(--ink-3)}
.field input{
  width:100%;min-width:0;border:0;background:transparent;text-align:center;
  font-family:inherit;font-size:17px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:.03em;padding:2px 0;border-radius:2px;
}
.field input:focus{outline:none;background:rgba(154,51,39,.07)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.btns{display:flex;gap:10px}
.btn{
  font-family:inherit;font-size:14px;letter-spacing:.2em;text-indent:.2em;
  padding:11px 14px;border-radius:2px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--ink-2);
  transition:background .18s ease,color .18s ease,border-color .18s ease,transform .06s ease;
}
.btn:hover{background:rgba(163,142,102,.10);color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.primary{flex:1.15;background:var(--red);border-color:var(--red);color:#fcf4e3;font-weight:700}
.btn.primary:hover{background:#872b20;border-color:#872b20;color:#fff8ea}
.btn.ghost{flex:1}
.btn.small{font-size:12px;letter-spacing:.12em;padding:7px 12px}
.hint{margin:0;font-size:11px;line-height:1.9;color:var(--ink-3);letter-spacing:.04em;text-align:center}
.hint.err{color:var(--red)}

/* ---------- 盘面头部 ---------- */
.chart-panel{padding:16px 14px 14px}
.chart-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:12px;padding:0 2px}
.pillars{font-size:15px;font-weight:700;letter-spacing:.1em;color:var(--ink)}
.pillars small{font-weight:400;color:var(--ink-3);font-size:11px;letter-spacing:.14em;margin-left:2px}
.ju{
  font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--red);
  padding:2px 8px;border:1px solid rgba(154,51,39,.35);border-radius:2px;background:rgba(154,51,39,.05);
}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;padding:2px 7px;border:1px solid var(--line-2);border-radius:99px;color:var(--ink-2);letter-spacing:.04em;background:rgba(255,252,244,.5)}
.chip.warn{color:var(--red);border-color:rgba(154,51,39,.35);background:rgba(154,51,39,.05)}

/* ---------- 九宫 ---------- */
.plate{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);
  box-shadow:0 0 0 4px rgba(203,191,166,.16), 0 6px 18px rgba(84,62,30,.08);
  user-select:none;
}
.cell{
  position:relative;background:var(--paper);border:0;padding:0;margin:0;
  aspect-ratio:1 / 1;font-family:inherit;color:inherit;text-align:left;
  cursor:pointer;overflow:hidden;transition:background .2s ease;
}
.cell:hover{background:#fdf9ee}
.cell:active{background:#f5eeda}
.cell:focus-visible{outline:2px solid rgba(154,51,39,.55);outline-offset:-2px}
.cell.center{background:linear-gradient(150deg,#f3ebd8,#efe5cf)}
.cell.center:hover{background:#f6efdd}
.wm{
  position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
  font-size:clamp(46px,13.5vw,86px);font-weight:700;line-height:1;
  color:rgba(92,76,50,.055);letter-spacing:0;
}
.cell-in{
  position:absolute;inset:0;padding:9px 10px 15px;
  display:flex;flex-direction:column;justify-content:space-between;
}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:5px}
.tian{font-size:clamp(19px,5.2vw,30px);font-weight:700;line-height:1;letter-spacing:.02em}
.tian.mu{color:#3f6036}
.tian.huo{color:#9a3327}
.tian.tu{color:#8a6a34}
.tian.jin{color:#6f6552}
.tian.shui{color:#2f536b}
.god{font-style:normal;font-size:clamp(10px,2.5vw,12.5px);color:var(--ink-3);letter-spacing:.12em;padding-top:3px;white-space:nowrap}
.row.mid{flex-direction:column;justify-content:center;align-items:center;gap:4px;margin:2px 0}
.star{font-style:normal;font-size:clamp(12px,3vw,16px);color:var(--ink-2);letter-spacing:.08em;white-space:nowrap}
.marks{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.marks i{
  font-style:normal;font-size:9.5px;line-height:1.25;padding:0 3px;white-space:nowrap;
  color:var(--red);border:1px solid rgba(154,51,39,.35);border-radius:1px;
  background:rgba(255,252,244,.72);
}
.marks i.ji{color:var(--gold);border-color:rgba(161,134,79,.5);background:rgba(255,252,244,.8)}
.row.bot{align-items:flex-end}
.men{font-size:clamp(13px,3.4vw,18px);font-weight:700;letter-spacing:.1em;color:var(--ink);white-space:nowrap}
.di{font-style:normal;font-size:clamp(12px,3vw,16px);color:#7d7159;letter-spacing:.04em;white-space:nowrap}
.gname{
  position:absolute;left:50%;bottom:3px;transform:translateX(-50%);
  font-size:9px;letter-spacing:.16em;text-indent:.16em;color:rgba(120,105,80,.6);white-space:nowrap;
}
.tag{
  position:absolute;right:2px;top:50%;transform:translateY(-50%);
  writing-mode:vertical-rl;font-size:9px;letter-spacing:2px;
  color:var(--red);background:rgba(252,247,235,.72);border-radius:2px;
  padding:3px 1px;opacity:.92;
}
.cell.base-time .tian{text-shadow:0 0 12px rgba(154,51,39,.12)}
.legend{
  display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;
  margin-top:12px;font-size:10.5px;color:var(--ink-3);letter-spacing:.05em;
}
.legend b{font-weight:400;color:var(--ink-2)}

/* ---------- 页脚 ---------- */
.foot{margin-top:22px;text-align:center;font-size:10.5px;line-height:2;color:var(--ink-3);letter-spacing:.04em}
.foot em{font-style:normal;color:var(--ink-2)}

/* ---------- 弹窗 ---------- */
.mask{
  position:fixed;inset:0;z-index:80;display:none;
  background:rgba(38,30,20,.44);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  align-items:center;justify-content:center;padding:18px;
}
.mask.on{display:flex;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  position:relative;width:min(580px,100%);max-height:86vh;overflow:auto;
  background:linear-gradient(180deg,#fcf8ee 0%,#f5eedd 100%);
  border:1px solid var(--line);border-radius:4px;
  box-shadow:0 30px 70px rgba(40,28,16,.36), 0 0 0 1px rgba(255,255,255,.5) inset;
  padding:22px 22px 26px;
  animation:rise .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.m-close{
  position:absolute;right:10px;top:8px;width:32px;height:32px;border:0;background:transparent;
  font-size:22px;line-height:1;color:var(--ink-3);cursor:pointer;border-radius:50%;
}
.m-close:hover{background:rgba(154,51,39,.08);color:var(--red)}
.m-head{padding-right:34px;border-bottom:1px solid var(--line-2);padding-bottom:12px;margin-bottom:14px}
.m-title{font-size:22px;font-weight:700;letter-spacing:.12em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.m-title small{font-size:11.5px;font-weight:400;color:var(--ink-3);letter-spacing:.1em}
.m-badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.m-badge{font-size:10.5px;padding:2px 8px;border-radius:2px;letter-spacing:.1em;background:rgba(154,51,39,.08);color:var(--red);border:1px solid rgba(154,51,39,.25)}
.m-badge.gold{background:rgba(161,134,79,.10);color:#7d6537;border-color:rgba(161,134,79,.3)}
.m-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:14px}
.m-item{background:rgba(255,252,244,.62);border:1px solid var(--line-2);border-radius:2px;padding:7px 9px}
.m-item em{display:block;font-style:normal;font-size:10px;letter-spacing:.14em;color:var(--ink-3);margin-bottom:3px}
.m-item b{font-size:15px;font-weight:700;letter-spacing:.06em}
.m-item b.dim{color:var(--ink-3);font-weight:400;font-size:13px}
.m-sec{margin-top:16px}
.m-sec h4{
  margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.22em;color:var(--ink-2);
  display:flex;align-items:center;gap:8px;
}
.m-sec h4::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--line),rgba(203,191,166,0))}
.m-sec p{margin:0 0 8px;font-size:12.5px;line-height:1.95;color:var(--ink-2);letter-spacing:.02em}
.m-sec p em{font-style:normal;color:var(--red);margin-right:6px;font-size:11px;letter-spacing:.1em}
.gj{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.gj li{background:rgba(255,252,244,.6);border:1px solid var(--line-2);border-left:2px solid var(--gold);padding:8px 10px;border-radius:2px}
.gj .gj-t{display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap}
.gj .gj-name{font-weight:700;font-size:13.5px;letter-spacing:.08em}
.gj .gj-type{font-size:10px;padding:1px 6px;border-radius:2px;letter-spacing:.08em}
.gj .gj-type.ji{color:#3f6036;background:rgba(63,96,54,.09);border:1px solid rgba(63,96,54,.25)}
.gj .gj-type.xiong{color:var(--red);background:rgba(154,51,39,.07);border:1px solid rgba(154,51,39,.25)}
.gj .gj-type.ping{color:#7d6537;background:rgba(161,134,79,.10);border:1px solid rgba(161,134,79,.28)}
.gj .gj-src{font-size:9.5px;color:var(--ink-3);letter-spacing:.06em}
.gj p{margin:0;font-size:12px;line-height:1.85;color:var(--ink-2)}
.empty{font-size:12px;color:var(--ink-3);margin:0}

/* ---------- 移动端 ---------- */
@media (max-width:640px){
  .wrap{padding:18px 12px 44px}
  .panel{padding:13px}
  .chart-panel{padding:13px 10px 12px}
  .fields{gap:5px}
  .field input{font-size:15.5px}
  .modal{
    width:100%;max-height:88vh;border-radius:8px 8px 0 0;
    padding:20px 16px 26px;
  }
  .mask{padding:0;align-items:flex-end}
  .m-grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
}
@media (max-width:380px){
  .verse{display:none}
  .cell-in{padding:7px 7px 14px}
  .god{letter-spacing:.02em}
  .gname{letter-spacing:.06em;text-indent:.06em}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="paper-grain" aria-hidden="true"></div>

<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <span class="seal">遁</span>
      <div>
        <h1>奇门遁甲</h1>
        <p class="sub">时家 · 拆补法 · 二十三时换日</p>
      </div>
    </div>
    <p class="verse">天乙值符布九宫，三奇六仪藏造化；<br />八门定吉凶之机，九星察往来之气。</p>
    <div class="divider"><i></i></div>
  </header>

  <section class="panel time-panel">
    <div class="fields">
      <label class="field"><span>年</span><input id="in-year" type="number" inputmode="numeric" min="1900" max="2100" step="1" /></label>
      <label class="field"><span>月</span><input id="in-month" type="number" inputmode="numeric" min="1" max="12" step="1" /></label>
      <label class="field"><span>日</span><input id="in-day" type="number" inputmode="numeric" min="1" max="31" step="1" /></label>
      <label class="field"><span>时</span><input id="in-hour" type="number" inputmode="numeric" min="0" max="23" step="1" /></label>
      <label class="field"><span>分</span><input id="in-minute" type="number" inputmode="numeric" min="0" max="59" step="1" /></label>
    </div>
    <div class="btns">
      <button id="btn-now" class="btn ghost" type="button">读取当前时间</button>
      <button id="btn-run" class="btn primary" type="button">排盘</button>
    </div>
    <p class="hint" id="hint">23:00 之后按次日子时起局 · 不使用真太阳时 · 仅拆补法</p>
  </section>

  <section class="panel chart-panel">
    <div class="chart-head" id="chartHead"></div>
    <div class="plate" id="plate"></div>
    <div class="legend">
      <span><b>天盘干</b> 左上</span>
      <span><b>地盘干</b> 右下</span>
      <span><b>八神</b> 右上</span>
      <span><b>九星</b> 居中</span>
      <span><b>八门</b> 左下</span>
      <span>点击宫位查看详解</span>
    </div>
  </section>

  <footer class="foot">
    <p>起局引擎 <em>bigfishmarquis-qimen</em>（时家 · 拆补法） · 历法 <em>lunar-javascript</em><br />
    仅供传统文化研究与学习之用</p>
  </footer>
</div>

<div class="mask" id="mask" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" id="modal">
    <button class="m-close" id="mClose" type="button" aria-label="关闭">×</button>
    <div id="mBody"></div>
  </div>
</div>

8\u4E3B\u80F8\u548C\u820C\u3002\u989C\u8272\u6DE1\u7EA2\u3002\u4E94\u5473\u5389\u5BB3\u3002\u5F62\u4F53\u79C0\u4E3D\u6E05\u9AD8\uFF0C\u5E7D\u5170\u6B8A\u82B3\u3002\u6027\u683C\u548C\u987A\u800C\u6709\u5FC3\u8BA1\uFF0C\u5F97\u4EE4\u5219\u65FA\u76DB\u5802\u7687\uFF0C\u5931\u4EE4\u5219\u95F7\u9A9A\u5AC9\u5992\u3002\u5728\u5947\u95E8\u4E2D\u4E01\u4E3A\u661F\u5947\uFF08\u4E09\u5947\u4E4B\u4E09\uFF09\uFF0C\u4E3A\u7389\u5973\uFF0C\u5728\u611F\u60C5\u8DEF\u4E0A\u5F80\u5F80\u4EE3\u8868\u7B2C\u4E09\u8005\u5973\u6027",\u4E94\u884C:"\u706B",\u9634\u9633:"\u9634",\u65B9\u4F4D:"\u5357\u65B9",\u661F\u5BBF:"\u5357\u6781\u661F\u3001\u7389\u5973\u661F\u3001\u70DB\u706B\u661F",\u6027\u683C:"\u548C\u987A\u800C\u6709\u5FC3\u8BA1\uFF0C\u5916\u67D4\u5185\u70ED\uFF0C\u806A\u660E\u7075\u5DE7\u3002\u5F97\u4EE4\u5219\u65FA\u76DB\u5802\u7687\uFF0C\u5931\u4EE4\u5219\u95F7\u9A9A\u5AC9\u5992",\u957F\u751F:"\u957F\u751F\u5728\u9149\uFF0C\u6C90\u6D74\u5728\u7533\uFF0C\u51A0\u5E26\u5728\u672A\uFF0C\u4E34\u5B98\u5728\u5348\uFF0C\u5E1D\u65FA\u5728\u5DF3\uFF0C\u8870\u5728\u8FB0\uFF0C\u75C5\u5728\u536F\uFF0C\u6B7B\u5728\u5BC5\uFF0C\u5893\u5728\u4E11\uFF0C\u7EDD\u5728\u5B50\uFF0C\u80CE\u5728\u4EA5\uFF0C\u517B\u5728\u620C",\u6982\u5FF5:"\u5E0C\u671B\u3001\u5C16\u9510\u3001\u5E26\u523A\u3001\u9876\u5C16\u3001\u7A81\u51FA\u3001\u6587\u660E\u3001\u6559\u5316\u3001\u4FE1\u606F\u3001\u6587\u4E66\u3001\u667A\u6167\u3001\u7075\u5DE7\u3001\u5949\u732E\u3001\u773C\u529B\u3001\u9488\u7078\u3001\u5C0F\u706B\u82D7",\u5929\u65F6:"\u661F\u5149\u3001\u6708\u8272\u3001\u706F\u706B\u3001\u95EA\u5149\u3001\u8424\u706B\u3001\u5F69\u971E\u3001\u6D41\u661F",\u5730\u7406:"\u4E66\u9662\u3001\u6587\u5316\u533A\u3001\u5E99\u5B87\u3001\u56FE\u4E66\u9986\u3001\u6587\u5316\u4E2D\u5FC3\u3001\u70DB\u5149\u665A\u5BB4\u3001\u5357\u65B9",\u5EFA\u7B51:"\u7089\u7076\u3001\u706F\u5854\u3001\u5F71\u9662\u3001\u8721\u70DB\u5382\u3001\u5B9E\u9A8C\u5BA4\u3001\u7814\u7A76\u6240\u3001\u591C\u603B\u4F1A",\u4EBA\u7269:"\u6587\u4EBA\u3001\u5C11\u5973\u3001\u79D8\u4E66\u3001\u4FE1\u4F7F\u3001\u4F5C\u5BB6\u3001\u987E\u95EE\u3001\u901A\u8BAF\u5458\u3001\u60C5\u5987\u3001\u7B2C\u4E09\u8005\u3001\u7389\u5973\u3001\u9488\u7078\u5E08",\u5F62\u6001:"\u79C0\u4E3D\u7AEF\u6B63\u3001\u9762\u7EA2\u5507\u7EA2\u3001\u8EAB\u6750\u7EA4\u7EC6\u3001\u773C\u795E\u7075\u52A8\u3001\u5F62\u4F53\u79C0\u4E3D\u6E05\u9AD8",\u6027\u60C5:"\u6E29\u67D4\u4F53\u8D34\u3001\u591A\u6101\u5584\u611F\u3001\u5584\u4E8E\u6D1E\u5BDF\u3001\u806A\u6167\u7075\u654F\u3001\u542B\u84C4\u5185\u655B\u3001\u548C\u987A\u6709\u5FC3\u8BA1\u3001\u5584\u4E8E\u7B97\u8BA1",\u4EBA\u4F53:"\u5FC3\u810F\u3001\u773C\u775B\u3001\u820C\u5934\u3001\u8840\u6DB2\u3001\u9F7F\u7259\u3001\u5507\u3001\u4E73\u623F\u3001\u795E\u7ECF\u672B\u68A2",\u9759\u7269:"\u706F\u706B\u3001\u8721\u70DB\u3001\u4FE1\u4EF6\u3001\u6587\u4E66\u3001\u624B\u673A\u3001\u6253\u706B\u673A\u3001\u9999\u70DF\u3001\u9488\u3001\u9489\u5B50\u3001\u56FE\u9489\u3001\u6307\u5357\u9488",\u989C\u8272:"\u7D2B\u8272\u3001\u6DE1\u7EA2\u8272\u3001\u7C89\u7EA2\u8272",\u5947\u95E8\u89D2\u8272:"\u4E01\u4E3A\u661F\u5947\uFF08\u4E09\u5947\u4E4B\u4E09\uFF09\uFF0C\u53C8\u79F0\u7389\u5973\u3002\u5F97\u4E01\u5947\u4E3B\u6587\u4E66\u4FE1\u606F\u5229\u8FBE\u3001\u901A\u7075\u6167\u609F\u3002\u4E01\u5947\u5F97\u4F7F\u5229\u4E8E\u9634\u8C0B\u7B56\u5212\u3001\u6587\u4E66\u4F20\u9012\u3001\u6697\u4E2D\u884C\u52A8"},\u620A:{\u672C\u4E49:"\u620A\u8005\uFF0C\u8302\u4E5F\uFF0C\u4E07\u7269\u8302\u76DB\u4E4B\u610F\u3002\u9633\u571F\uFF0C\u4E3A\u57CE\u5899\u4E3A\u9AD8\u5C71\u3002\u4F4D\u5C45\u4E2D\u592E\u3002\u4E94\u810F\u53D7\u80C3\u4E3B\u808C\u8089\u548C\u76AE\uFF0C\u4F53\u8868\u4E3B\u808B\u9AA8\u548C\u8179\u58C1\u3002\u989C\u8272\u6DF1\u9EC4\u3002\u4E94\u5473\u4E3A\u7518\u3002\u6027\u53EF\u77E5\u9633\u539A\u91CD\u7EAF\u6734\uFF0C\u7A33\u91CD\u8E0F\u5B9E\u3002\u5728\u5947\u95E8\u4E2D\u620A\u4E3A\u5929\u7984\u3001\u516D\u4EEA\u4E4B\u9996\uFF0C\u4EE3\u8868\u7532\u7684\u66FF\u8EAB\uFF08\u7532\u5B50\u9041\u620A\uFF09,\u662F\u503C\u7B26\u3001\u8D22\u661F\u3001\u8D44\u672C\u3002\u620A\u5B57\u5F62\u5982\u6208\u5B88\u57CE,\u4EE3\u8868\u57CE\u9632\u3001\u5B88\u536B\u3001\u8D44\u672C\u3001\u94B1\u8D22",\u4E94\u884C:"\u571F",\u9634\u9633:"\u9633",\u65B9\u4F4D:"\u4E2D\u592E",\u661F\u5BBF:"\u571F\u661F\u3001\u9547\u661F",\u6027\u683C:"\u539A\u91CD\u5FE0\u5B9E\u3001\u6C89\u7A33\u8E0F\u5B9E\u3001\u56FA\u6267\u4FDD\u5B88\u3002\u4E3A\u4EBA\u8BDA\u4FE1\u800C\u65B9\u6B63\uFF0C\u4F46\u53CD\u5E94\u8FDF\u7F13",\u957F\u751F:"\u957F\u751F\u5728\u5BC5\uFF0C\u6C90\u6D74\u5728\u536F\uFF0C\u51A0\u5E26\u5728\u8FB0\uFF0C\u4E34\u5B98\u5728\u5DF3\uFF0C\u5E1D\u65FA\u5728\u5348\uFF0C\u8870\u5728\u672A\uFF0C\u75C5\u5728\u7533\uFF0C\u6B7B\u5728\u9149\uFF0C\u5893\u5728\u620C\uFF0C\u7EDD\u5728\u4EA5\uFF0C\u80CE\u5728\u5B50\uFF0C\u517B\u5728\u4E11",\u6982\u5FF5:"\u8D44\u672C\u3001\u94B1\u8D22\u3001\u4ED3\u5E93\u3001\u57CE\u6C60\u3001\u539A\u5B9E\u3001\u7A33\u56FA\u3001\u5B88\u62A4\u3001\u8BDA\u4FE1\u3001\u5927\u5757\u3001\u96C4\u539A\u3001\u575A\u56FA\u3001\u5824\u575D",\u5929\u65F6:"\u9634\u5929\u3001\u973E\u5929\u3001\u6D6E\u4E91\u3001\u5C71\u5C9A\u3001\u9EC4\u6C99\u3001\u6C99\u5C18\u66B4\u3001\u571F\u65FA\u4E4B\u65E5",\u5730\u7406:"\u5927\u5C71\u3001\u5824\u575D\u3001\u57CE\u5899\u3001\u5E73\u539F\u3001\u9AD8\u539F\u3001\u77FF\u533A\u3001\u53E4\u57CE\u3001\u8981\u585E",\u5EFA\u7B51:"\u57CE\u5899\u3001\u4ED3\u5E93\u3001\u5824\u9632\u3001\u94F6\u884C\u3001\u5927\u578B\u5EFA\u7B51\u3001\u7889\u5821\u3001\u6C34\u575D\u3001\u53E4\u57CE\u697C",\u4EBA\u7269:"\u957F\u8F88\u3001\u8D22\u52A1\u4EBA\u5458\u3001\u623F\u4E3B\u3001\u5730\u4E3B\u3001\u4FDD\u7BA1\u5458\u3001\u4F1A\u8BA1\u3001\u94F6\u884C\u5BB6\u3001\u7532\u7684\u66FF\u8EAB",\u5F62\u6001:"\u6566\u539A\u65B9\u6B63\u3001\u7C97\u58EE\u77EE\u80D6\u3001\u9762\u9EC4\u808C\u539A\u3001\u6B65\u6001\u6C89\u91CD\u3001\u58EE\u5B9E\u9B41\u68A7",\u6027\u60C5:"\u5FE0\u539A\u8001\u5B9E\u3001\u6C89\u9ED8\u5BE1\u8A00\u3001\u7A33\u91CD\u53EF\u9760\u3001\u56FA\u6267\u4FDD\u5B88\u3001\u8BDA\u4FE1\u65B9\u6B63\u3001\u53CD\u5E94\u8FDF\u7F13",\u4EBA\u4F53:"\u80C3\u3001\u808B\u9AA8\u3001\u76AE\u80A4\u3001\u808C\u8089\u3001\u80CC\u90E8\u3001\u8179\u58C1\u3001\u9F3B\u6881",\u9759\u7269:"\u9676\u74F7\u3001\u571F\u4EA7\u54C1\u3001\u751C\u5473\u98DF\u54C1\u3001\u5EFA\u7B51\u6750\u6599\u3001\u7816\u77F3\u3001\u9EC4\u91D1\u3001\u94B1\u5E01\u3001\u8D44\u4EA7",\u989C\u8272:"\u9EC4\u8272\u3001\u68D5\u8272\u3001\u571F\u8272",\u5947\u95E8\u89D2\u8272:"\u620A\u4E3A\u516D\u4EEA\u4E4B\u9996\uFF0C\u7532\u5B50\u9041\u4E8E\u620A\u3002\u620A\u5373\u7532\u5B50\uFF0C\u4E3A\u503C\u7B26\u5929\u7984\uFF0C\u4EE3\u8868\u8D22\u661F\u548C\u9886\u5BFC\u6743\u529B\u3002\u620A\u4E3A\u5947\u95E8\u4E2D\u6700\u91CD\u8981\u7684\u516D\u4EEA\uFF0C\u9022\u4E4B\u4E3B\u5BCC\u8D35",\u516D\u58EC\u5173\u8054:"\u620A\u5373\u7532\u5B50\uFF0C\u5B50\u4E3A\u5927\u516D\u58EC\u5341\u4E8C\u5C06\u4E2D\u7684'\u795E\u540E'\u3002\u795E\u540E\u4E3B\u9634\u79C1\u5973\u4EBA\u3001\u540E\u5BAB\u4E4B\u4E8B\u3001\u67D4\u987A\u6697\u6627\u3002\u5B50\u6C34\u4E3A\u81F3\u9634\u4E4B\u4F4D\uFF0C\u4E3B\u591C\u95F4\u3001\u9690\u79D8\u3001\u5973\u6027\u3001\u60C5\u611F\u3001\u751F\u80B2\u3001\u6697\u4E2D\u4E4B\u4E8B\u3002\u5728\u5947\u95E8\u4E2D\u620A\u867D\u4E3A\u9633\u571F\u8D22\u661F\uFF0C\u4F46\u5176\u65EC\u9996\u7532\u5B50\u7684\u5B50\u6C34\u7279\u6027\u4F7F\u620A\u517C\u6709\u7384\u5999\u6697\u85CF\u4E4B\u8C61\u2014\u2014\u8D22\u5BCC\u5F80\u5F80\u85CF\u4E8E\u6697\u5904\uFF0C\u5927\u8D22\u4E0D\u9732"},\u5DF1:{\u672C\u4E49:"\u5DF1\u8005\uFF0C\u7EAA\u4E5F\uFF0C\u4E07\u7269\u6709\u5F62\u53EF\u7EAA\u8BC6\u3002\u9634\u571F\uFF0C\u4E3A\u7530\u56ED\u4E3A\u5E73\u5730\u3002\u4F4D\u5C45\u4E2D\u592E\u3002\u4E94\u810F\u53D7\u813E\u4E3B\u8179\u548C\u808C\u8089\u3002\u989C\u8272\u6D45\u9EC4\u3002\u4E94\u5473\u4E3A\u7518\u3002\u6027\u53EF\u77E5\u9634\u67D4\u542B\u84C4\uFF0C\u5FC3\u601D\u7F1C\u5BC6\u3002\u5728\u5947\u95E8\u4E2D\u5DF1\u4E3A\u5730\u6237\u3001\u516D\u4EEA\u4E4B\u4E8C\uFF0C\u4EE3\u8868\u9634\u79C1\u6697\u6627\u3001\u5730\u6237\u5893\u5E93\u3002\u5DF1\u5B57\u5F62\u5982\u5F2F\u66F2\u7EA0\u7F20\u4E4B\u86C7\uFF0C\u4EE3\u8868\u66F2\u6298\u3001\u7F20\u7EF5\u3001\u9634\u79C1\u3001\u6697\u5730",\u4E94\u884C:"\u571F",\u9634\u9633:"\u9634",\u65B9\u4F4D:"\u4E2D\u592E",\u661F\u5BBF:"\u571F\u661F\u3001\u5730\u6237",\u6027\u683C:"\u6E29\u987A\u8C26\u548C\u3001\u542B\u84C4\u5185\u655B\u3001\u5584\u4E8E\u8C03\u548C\u3002\u5FC3\u601D\u7F1C\u5BC6\u3001\u57CE\u5E9C\u8F83\u6DF1\uFF0C\u4F18\u67D4\u5BE1\u65AD",\u957F\u751F:"\u957F\u751F\u5728\u9149\uFF0C\u6C90\u6D74\u5728\u7533\uFF0C\u51A0\u5E26\u5728\u672A\uFF0C\u4E34\u5B98\u5728\u5348\uFF0C\u5E1D\u65FA\u5728\u5DF3\uFF0C\u8870\u5728\u8FB0\uFF0C\u75C5\u5728\u536F\uFF0C\u6B7B\u5728\u5BC5\uFF0C\u5893\u5728\u4E11\uFF0C\u7EDD\u5728\u5B50\uFF0C\u80CE\u5728\u4EA5\uFF0C\u517B\u5728\u620C",\u6982\u5FF5:"\u5305\u5BB9\u3001\u517B\u80B2\u3001\u7F20\u7ED5\u3001\u9634\u79C1\u3001\u6742\u4E71\u3001\u67D4\u987A\u3001\u5351\u5FAE\u3001\u7EC6\u788E\u3001\u7530\u4EA7\u3001\u5730\u6237\u3001\u5893\u5E93\u3001\u7EA0\u7F20",\u5929\u65F6:"\u9634\u4E91\u3001\u96FE\u6C14\u3001\u6F6E\u6E7F\u5929\u6C14\u3001\u6885\u96E8\u3001\u5730\u6C14\u6F6E\u6E7F",\u5730\u7406:"\u7530\u5730\u3001\u82B1\u56ED\u3001\u677E\u8F6F\u4E4B\u5730\u3001\u6E7F\u5730\u3001\u519C\u7530\u3001\u6D3C\u5730\u3001\u5893\u5730\u3001\u6CBC\u6CFD",\u5EFA\u7B51:"\u623F\u820D\u3001\u5730\u4E0B\u5BA4\u3001\u4F4E\u77EE\u5EFA\u7B51\u3001\u5E73\u623F\u3001\u7CAE\u4ED3\u3001\u6CE5\u571F\u5C4B\u3001\u5395\u6240",\u4EBA\u7269:"\u59BB\u59BE\u3001\u519C\u6C11\u3001\u9634\u8C0B\u8005\u3001\u4FDD\u59C6\u3001\u56ED\u4E01\u3001\u4E2D\u4ECB\u3001\u79C1\u4E0B\u4EA4\u6613\u8005",\u5F62\u6001:"\u77EE\u80D6\u3001\u9762\u9EC4\u3001\u8EAB\u6750\u4F4E\u77EE\u3001\u76AE\u80A4\u7C97\u7CD9\u3001\u9762\u76EE\u4E0D\u6E05",\u6027\u60C5:"\u5FC3\u601D\u7F1C\u5BC6\u3001\u4F18\u67D4\u5BE1\u65AD\u3001\u5305\u5BB9\u67D4\u987A\u3001\u5C0F\u5FC3\u8C28\u614E\u3001\u5584\u4E8E\u5BDF\u8A00\u89C2\u8272\u3001\u5584\u4E8E\u5E55\u540E\u64CD\u63A7",\u4EBA\u4F53:"\u813E\u3001\u8179\u90E8\u3001\u808C\u8089\u3001\u6D88\u5316\u7CFB\u7EDF\u3001\u76AE\u80A4",\u9759\u7269:"\u6CE5\u571F\u3001\u7EBA\u7EC7\u54C1\u3001\u751C\u98DF\u3001\u9762\u7C89\u3001\u6742\u7CAE\u3001\u5316\u5986\u54C1\u3001\u7530\u5951\u3001\u5730\u5951",\u989C\u8272:"\u9EC4\u8272\u3001\u8089\u8272\u3001\u571F\u9EC4\u8272",\u5947\u95E8\u89D2\u8272:"\u5DF1\u4E3A\u516D\u4EEA\u4E4B\u4E8C\uFF0C\u7532\u620C\u9041\u4E8E\u5DF1\u3002\u5DF1\u4E3A\u5730\u6237\u3001\u5893\u5E93\uFF0C\u4EE3\u8868\u575F\u5893\u3001\u9634\u6697\u3001\u9690\u79C1\u4E4B\u5730\u3002\u5DF1\u52A0\u4E09\u5947\u4E3A\u5893\u4E2D\u85CF\u5947",\u516D\u58EC\u5173\u8054:"\u5DF1\u5373\u7532\u620C\uFF0C\u620C\u4E3A\u5927\u516D\u58EC\u5341\u4E8C\u5C06\u4E2D\u7684'\u6CB3\u9B41'\u3002\u6CB3\u9B41\u4E3B\u7262\u72F1\u5211\u7F5A\u3001\u9634\u6697\u5E7D\u95ED\u3001\u575F\u5893\u5893\u5E93\u3002\u620C\u4E3A\u5929\u95E8\u534E\u76D6\u3001\u706B\u5E93\u4E4B\u4F4D\uFF0C\u4E3B\u4E89\u8BBC\u5B98\u975E\u3001\u7262\u72F1\u4E4B\u707E\u3002\u5728\u5927\u516D\u58EC\u4E2D\u6CB3\u9B41\u4E3A\u9634\u4E2D\u4E4B\u9634\uFF0C\u51E1\u4E34\u4E4B\u4E3B\u4E8B\u6697\u6666\u4E0D\u660E\u3001\u6709\u7262\u72F1\u4E4B\u5FE7\u3002\u5728\u5947\u95E8\u4E2D\u5DF1\u7684\u6CB3\u9B41\u7279\u6027\u5F3A\u5316\u4E86\u5DF1\u4E3A\u5730\u6237\u5893\u5E93\u7684\u542B\u4E49\u2014\u2014\u6D4B\u7262\u72F1\u770B\u5DF1\u843D\u5BAB\uFF0C\u6D4B\u575F\u5893\u9634\u5B85\u4EA6\u4EE5\u5DF1\u4E3A\u53C2\u8003"},\u5E9A:{\u672C\u4E49:"\u5E9A\u8005\uFF0C\u66F4\u4E5F\uFF0C\u4E07\u7269\u66F4\u65B0\u4E4B\u610F\u3002\u521A\u5065\u4E4B\u91D1\u3002\u9633\u91D1\uFF0C\u4E3A\u5175\u6208\u4E3A\u5200\u5251\u3002\u4F4D\u5C45\u897F\u65B9\u3002\u4E94\u810F\u53D7\u80BA\u4E3B\u5927\u80A0\u548C\u9AA8\u9ABC\u3002\u989C\u8272\u767D\u3002\u4E94\u5473\u4E3A\u8F9B\u3002\u6027\u53EF\u77E5\u9633\u521A\u679C\u51B3\uFF0C\u6740\u4F10\u51B3\u65AD\uFF0C\u597D\u52C7\u597D\u6597\u3002\u5728\u5947\u95E8\u4E2D\u5E9A\u4E3A\u592A\u767D\u3001\u5929\u5211\uFF0C\u4EE3\u8868\u654C\u4EBA\u3001\u4EC7\u4EBA\u3001\u963B\u9694\u3001\u5C0F\u4EBA\u3001\u707E\u96BE\u3002\u5E9A\u5B57\u5F62\u5982\u521A\u786C\u7684\u79CB\u91D1\uFF0C\u4EE3\u8868\u53D8\u66F4\u3001\u8083\u6740\u3001\u5211\u7F5A\u3001\u963B\u788D\u3001\u9053\u8DEF",\u4E94\u884C:"\u91D1",\u9634\u9633:"\u9633",\u65B9\u4F4D:"\u897F\u65B9",\u661F\u5BBF:"\u592A\u767D\u91D1\u661F\u3001\u767D\u864E\u3001\u5929\u5211",\u6027\u683C:"\u521A\u6BC5\u679C\u65AD\u3001\u597D\u52C7\u597D\u6597\u3001\u94C1\u9762\u65E0\u60C5\u3002\u6027\u521A\u800C\u66B4\uFF0C\u6709\u6740\u4F10\u4E4B\u6C14",\u957F\u751F:"\u957F\u751F\u5728\u5DF3\uFF0C\u6C90\u6D74\u5728\u5348\uFF0C\u51A0\u5E26\u5728\u672A\uFF0C\u4E34\u5B98\u5728\u7533\uFF0C\u5E1D\u65FA\u5728\u9149\uFF0C\u8870\u5728\u620C\uFF0C\u75C5\u5728\u4EA5\uFF0C\u6B7B\u5728\u5B50\uFF0C\u5893\u5728\u4E11\uFF0C\u7EDD\u5728\u5BC5\uFF0C\u80CE\u5728\u536F\uFF0C\u517B\u5728\u8FB0",\u6982\u5FF5:"\u6218\u4E89\u3001\u5211\u7F5A\u3001\u8083\u6740\u3001\u9053\u8DEF\u3001\u963B\u9694\u3001\u7ADE\u4E89\u3001\u4EC7\u654C\u3001\u53D8\u9769\u3001\u66F4\u65B0\u3001\u521A\u786C\u3001\u6740\u6C14\u3001\u94C1\u9762\u3001\u8FC1\u79FB\u3001\u4F20\u9012",\u5929\u65F6:"\u79CB\u98CE\u3001\u971C\u964D\u3001\u5927\u98CE\u3001\u51B0\u96F9\u3001\u5E72\u71E5\u4E4B\u6C14\u3001\u8083\u6740\u4E4B\u79CB",\u5730\u7406:"\u77FF\u5C71\u3001\u94C1\u8DEF\u3001\u5173\u9698\u3001\u6218\u573A\u3001\u897F\u65B9\u3001\u91D1\u5C5E\u51B6\u70BC\u533A\u3001\u5211\u573A\u3001\u9053\u8DEF\u3001\u9A7F\u7AD9",\u5EFA\u7B51:"\u5175\u8425\u3001\u6CD5\u9662\u3001\u5DE5\u5382\u3001\u76D1\u72F1\u3001\u91D1\u5C5E\u5382\u3001\u94A2\u94C1\u5382\u3001\u6B66\u5668\u5E93\u3001\u8F66\u7AD9",\u4EBA\u7269:"\u519B\u4EBA\u3001\u8B66\u5BDF\u3001\u6CD5\u5B98\u3001\u6B66\u672F\u5BB6\u3001\u5916\u79D1\u533B\u751F\u3001\u654C\u4EBA\u3001\u4EC7\u4EBA\u3001\u7ADE\u4E89\u5BF9\u624B\u3001\u523D\u5B50\u624B\u3001\u4FE1\u4F7F\u3001\u9A7F\u5352",\u5F62\u6001:"\u65B9\u6B63\u6709\u529B\u3001\u9762\u767D\u3001\u4F53\u683C\u58EE\u7855\u3001\u68F1\u89D2\u5206\u660E\u3001\u76EE\u5149\u9510\u5229",\u6027\u60C5:"\u521A\u70C8\u679C\u51B3\u3001\u597D\u6597\u4E89\u5F3A\u3001\u94C1\u9762\u65E0\u79C1\u3001\u5AC9\u6076\u5982\u4EC7\u3001\u6740\u4F10\u679C\u65AD\u3001\u597D\u52C7\u5584\u6218\u3001\u5584\u5954\u8D70",\u4EBA\u4F53:"\u80BA\u3001\u5927\u80A0\u3001\u9AA8\u9ABC\u3001\u7259\u9F7F\u3001\u6C14\u7BA1\u3001\u810A\u690E\u3001\u7B4B\u9AA8",\u9759\u7269:"\u5200\u5251\u5175\u5668\u3001\u91D1\u5C5E\u5668\u5177\u3001\u8F9B\u8FA3\u98DF\u54C1\u3001\u6C7D\u8F66\u3001\u673A\u68B0\u3001\u94A2\u94C1\u3001\u624B\u94D0\u3001\u8F66\u8F86",\u989C\u8272:"\u767D\u8272\u3001\u94F6\u8272\u3001\u91D1\u5C5E\u8272",\u5947\u95E8\u89D2\u8272:"\u5E9A\u4E3A\u516D\u4EEA\u4E4B\u4E09\uFF0C\u7532\u7533\u9041\u4E8E\u5E9A\u3002\u5E9A\u4E3A\u592A\u767D\u5929\u5211\uFF0C\u4EE3\u8868\u654C\u4EBA\u3001\u963B\u9694\u3001\u707E\u96BE\u3002\u5947\u95E8\u4E2D\u5E9A\u662F\u6700\u5927\u7684\u51F6\u661F\u516D\u4EEA\uFF0C\u683C\u5C40\u4E2D\u9022\u5E9A\u591A\u4E3B\u4E0D\u5229\u3002\u5E9A\u52A0\u4E09\u5947\u591A\u4E3A\u51F6\u683C",\u516D\u58EC\u5173\u8054:"\u5E9A\u5373\u7532\u7533\uFF0C\u7533\u4E3A\u5927\u516D\u58EC\u5341\u4E8C\u5C06\u4E2D\u7684'\u4F20\u9001'\u3002\u4F20\u9001\u4E3B\u8FC1\u79FB\u53D8\u52A8\u3001\u9053\u8DEF\u4F20\u9012\u3001\u9A7F\u7AD9\u4FE1\u4F7F\u3001\u8FDC\u884C\u51FA\u5DEE\u3002\u7533\u91D1\u4E3A\u5764\u4F4D\u4E4B\u91D1\uFF0C\u957F\u751F\u4E4B\u5730\uFF0C\u65FA\u6C14\u5954\u8D70\u3002\u5728\u5927\u516D\u58EC\u4E2D\u4F20\u9001\u4E3B\u9053\u8DEF\u3001\u8FC1\u5F99\u3001\u4FE1\u606F\u4F20\u9012\u3001\u5FEB\u9012\u7269\u6D41\u3002\u5728\u5947\u95E8\u4E2D\u5E9A\u7684\u4F20\u9001\u7279\u6027\u89E3\u91CA\u4E86\u5E9A\u4E3A\u4EC0\u4E48\u65E2\u4E3B\u963B\u9694\u4E5F\u4E3B\u9053\u8DEF\u2014\u2014\u5E9A\u4E3A\u884C\u8DEF\u8005\u9047\u963B\u3001\u4E5F\u4E3A\u53D8\u66F4\u8FC1\u79FB\u4E4B\u8C61\u3002\u5E9A\u7684\u4F20\u9001\u6027\u8D28\u4F7F\u5176\u5728\u6D4B\u51FA\u884C\u65F6\u5C24\u4E3A\u91CD\u8981"},\u8F9B:{\u672C\u4E49:"\u8F9B\u8005\uFF0C\u65B0\u4E5F\uFF0C\u4EA6\u8F9B\u82E6\u4E4B\u610F\u3002\u4E07\ C\u539F\u59CB\u5BAB\u4F4D\u5728\u4E1C\u65B9\u9707\u4E09\u5BAB\uFF0C\u4E94\u884C\u5C5E\u6728\u3002\u65FA\u4E8E\u6625\u5B63\uFF0C\u76F8\u4E8E\u51AC\u5B63\uFF0C\u4F11\u4E8E\u590F\u5B63\uFF0C\u56DA\u4E8E\u56DB\u5B63\u672B\uFF0C\u6B7B\u4E8E\u79CB\u5B63\u3002\u5929\u51B2\u4E3A\u96F7\u9706\u9707\u52A8\u4E4B\u661F\uFF0C\u5982\u6625\u96F7\u60CA\u86F0\u4E07\u7269\u590D\u82CF\u3002\u6027\u6025\u800C\u6709\u9B44\u529B\uFF0C\u679C\u51B3\u52C7\u731B\u3002\u4E0E\u4F24\u95E8\u5BF9\u5E94\uFF0C\u597D\u52A8\u4E0D\u597D\u9759\uFF0C\u5409\u51F6\u5404\u534A\u3002\u5229\u4E8E\u4E3B\u52A8\u51FA\u51FB\u4E0D\u5229\u56FA\u5B88",\u5409\u51F6:"\u5C0F\u5409\u4E4B\u661F\u3002\u6027\u8E81\u597D\u52A8\u3002\u5229\u4E8E\u51FA\u884C\u3001\u5F81\u6218\u3001\u7ADE\u4E89\u3001\u4F53\u80B2\u3001\u6267\u6CD5\u3001\u519B\u4E8B\u884C\u52A8\u3002",\u4E07\u7269\u7C7B\u8C61:{\u6982\u5FF5:"\u884C\u52A8\u3001\u51B2\u51FB\u3001\u7ADE\u4E89\u3001\u4E89\u6597\u3001\u8FD0\u52A8\u3001\u5FEB\u901F\u3001\u679C\u65AD\u3001\u6B66\u52C7\u3001\u5192\u9669\u3001\u6025\u8E81\u3001\u5F00\u521B\u3001\u7206\u53D1\u3001\u60CA\u96F7",\u5929\u65F6:"\u96F7\u7535\u3001\u6625\u96F7\u3001\u5730\u9707\u3001\u72C2\u98CE\u3001\u66B4\u96E8\u521D\u6B47\u3001\u60CA\u86F0",\u5730\u7406:"\u9053\u8DEF\u3001\u6218\u573A\u3001\u8FD0\u52A8\u573A\u3001\u68EE\u6797\u3001\u95F9\u5E02\u533A\u3001\u9AD8\u901F\u516C\u8DEF\u3001\u8D5B\u573A\u3001\u64CD\u573A\u3001\u519B\u4E8B\u57FA\u5730",\u4EBA\u7269:"\u519B\u4EBA\u3001\u6B66\u5C06\u3001\u8FD0\u52A8\u5458\u3001\u53F8\u673A\u3001\u63A2\u9669\u5BB6\u3001\u957F\u7537\u3001\u8B66\u5BDF\u3001\u6D88\u9632\u5458\u3001\u5148\u950B\u3001\u521B\u4E1A\u8005",\u6027\u60C5:"\u52C7\u731B\u679C\u65AD\u3001\u6025\u8E81\u51B2\u52A8\u3001\u6B63\u76F4\u521A\u5F3A\u3001\u6562\u4E8E\u5192\u9669\u3001\u597D\u80DC\u4E89\u5F3A\u3001\u96F7\u5389\u98CE\u884C\u3001\u884C\u52A8\u6D3E",\u5F62\u6001:"\u8EAB\u6750\u9AD8\u5927\u3001\u58F0\u97F3\u6D2A\u4EAE\u3001\u9762\u8272\u9752\u9ED1\u3001\u6B65\u4F10\u77EB\u5065\u3001\u7CBE\u529B\u65FA\u76DB",\u4EBA\u4F53:"\u809D\u80C6\u3001\u8DB3\u90E8\u3001\u795E\u7ECF\u7CFB\u7EDF\u3001\u7B4B\u9AA8\u3001\u5DE6\u80C1\u3001\u56DB\u80A2",\u9759\u7269:"\u8F66\u8F86\u3001\u6B66\u5668\u3001\u4E50\u5668\u3001\u8FD0\u52A8\u5668\u6750\u3001\u9F13\u3001\u949F\u3001\u7B1B\u3001\u519B\u53F7",\u8272\u5F69:"\u78A7\u7EFF\u8272\u3001\u9752\u8272"}},\u5929\u8F85:{\u4E94\u884C:"\u6728",\u65B9\u4F4D:"\u4E1C\u5357",\u5366\u5BAB:"\u5DFD\u56DB\u5BAB",\u6027\u8D28:"\u5409",\u661F\u6027:"\u5929\u8F85\u661F\u53C8\u540D\u6587\u66F2\u661F\uFF0C\u539F\u59CB\u5BAB\u4F4D\u5728\u4E1C\u5357\u5DFD\u56DB\u5BAB\uFF0C\u4E94\u884C\u5C5E\u6728\u3002\u65FA\u4E8E\u6625\u5B63\uFF0C\u76F8\u4E8E\u51AC\u5B63\uFF0C\u4F11\u4E8E\u590F\u5B63\uFF0C\u56DA\u4E8E\u56DB\u5B63\u672B\uFF0C\u6B7B\u4E8E\u79CB\u5B63\u3002\u5929\u8F85\u4E3A\u6587\u660C\u4E4B\u661F\u3001\u8F85\u5F3C\u4E4B\u81E3\u3002\u4E3B\u6587\u5B66\u827A\u672F\u3001\u5B66\u672F\u6559\u80B2\u3001\u7B56\u7565\u8C0B\u5212\u3002\u6027\u6E29\u548C\u5584\u826F\u5982\u6625\u98CE\u62C2\u9762\u3002\u4E0E\u675C\u95E8\u76F8\u5BF9\u5E94\u3002\u5229\u4E8E\u6587\u5316\u6559\u80B2\u3001\u5B66\u672F\u7814\u7A76\u3001\u5B97\u6559\u4FE1\u4EF0",\u5409\u51F6:"\u5927\u5409\u4E4B\u661F\u3002\u5229\u8003\u8BD5\u3001\u6C42\u5B66\u3001\u6C42\u804C\u3001\u8C08\u5224\u3001\u7B56\u5212\u3001\u6559\u80B2\u3002\u6E29\u6587\u5C14\u96C5\u3001\u8F85\u5F3C\u4E4B\u81E3\u3002",\u4E07\u7269\u7C7B\u8C61:{\u6982\u5FF5:"\u6587\u5316\u3001\u6559\u80B2\u3001\u7B56\u5212\u3001\u8F85\u52A9\u3001\u8C0B\u5212\u3001\u5F15\u5BFC\u3001\u4F20\u9053\u3001\u4FE1\u4EF0\u3001\u547D\u7406\u3001\u98CE\u6C34\u3001\u5B97\u6559\u3001\u5B66\u672F\u3001\u53C2\u8C0B",\u5929\u65F6:"\u548C\u98CE\u3001\u5FAE\u96E8\u3001\u6625\u5149\u660E\u5A9A\u3001\u98CE\u548C\u65E5\u4E3D\u3001\u5F69\u4E91\u3001\u6E05\u660E\u65F6\u8282",\u5730\u7406:"\u5B66\u6821\u3001\u4E66\u623F\u3001\u5BFA\u5E99\u3001\u56FE\u4E66\u9986\u3001\u56ED\u6797\u3001\u82B1\u5E02\u3001\u6559\u5802\u3001\u7814\u7A76\u673A\u6784\u3001\u6587\u5316\u4E2D\u5FC3",\u4EBA\u7269:"\u6587\u4EBA\u3001\u5B66\u8005\u3001\u6559\u5E08\u3001\u53C2\u8C0B\u3001\u987E\u95EE\u3001\u50E7\u9053\u3001\u5C3C\u59D1\u3001\u7267\u5E08\u3001\u957F\u5973\u3001\u8BBE\u8BA1\u5E08\u3001\u7B56\u5212\u5E08\u3001\u51FA\u7248\u4EBA",\u6027\u60C5:"\u6E29\u6587\u5C14\u96C5\u3001\u535A\u5B66\u591A\u624D\u3001\u5584\u4E8E\u8C0B\u5212\u3001\u5FC3\u601D\u7EC6\u817B\u3001\u8C26\u865A\u6709\u793C\u3001\u8010\u5FC3\u7EC6\u81F4\u3001\u5584\u4E8E\u8F85\u4F50",\u5F62\u6001:"\u6E05\u79C0\u6587\u96C5\u3001\u9762\u8272\u548C\u6DA6\u3001\u8EAB\u6750\u4FEE\u957F\u3001\u4E66\u5377\u6C14\u3001\u6C14\u8D28\u4F18\u96C5",\u4EBA\u4F53:"\u809D\u80C6\u3001\u5934\u53D1\u3001\u80A1\u90E8\u3001\u98CE\u6E7F\u3001\u795E\u7ECF\u7CFB\u7EDF\u3001\u6C14\u7BA1",\u9759\u7269:"\u4E66\u7C4D\u3001\u6587\u5177\u3001\u7ECF\u5377\u3001\u5B57\u753B\u3001\u4E50\u5668\u3001\u901A\u4FE1\u8BBE\u5907\u3001\u6559\u6750\u3001\u7ECF\u4E66",\u8272\u5F69:"\u9752\u7FE0\u8272\u3001\u7EFF\u8272"}},\u5929\u79BD:{\u4E94\u884C:"\u571F",\u65B9\u4F4D:"\u4E2D",\u5366\u5BAB:"\u4E2D\u4E94\u5BAB",\u6027\u8D28:"\u5409",\u661F\u6027:"\u5929\u79BD\u661F\u53C8\u540D\u5EC9\u8D1E\u661F\uFF0C\u5C45\u4E8E\u4E2D\u592E\u4E2D\u4E94\u5BAB\uFF0C\u4E94\u884C\u5C5E\u571F\u3002\u4E0A\u5E94\u5317\u6781\u5E1D\u661F\uFF0C\u4E3A\u56DB\u6B63\u4E4B\u67A2\u7EBD\u3002\u5929\u79BD\u5C45\u4E2D\u5BAB\u4E3A\u81F3\u5C0A\u4E4B\u4F4D\uFF0C\u7EDF\u9886\u516B\u65B9\u3001\u8C03\u548C\u56DB\u6B63\u3002\u4E2D\u5BAB\u65E0\u95E8\u65E0\u661F\u843D\u5165\uFF0C\u5929\u79BD\u5BC4\u4E8E\u5764\u4E8C\u5BAB\u5929\u82AE\uFF0C\u968F\u5929\u82AE\u4E00\u8D77\u8F6C\u5BAB\u5E03\u76D8\uFF0C\u5408\u79F0\u79BD\u82AE\u3002\u5929\u79BD\u4E3B\u4FE1\u7528\u8BDA\u5B9E\u3001\u6838\u5FC3\u67A2\u7EBD",\u5409\u51F6:"\u5927\u5409\u4E4B\u661F\u3002\u5C45\u4E2D\u8C03\u548C\uFF0C\u7EDF\u6444\u516B\u65B9\u3002\u5229\u4E8E\u8FD0\u7B79\u5E37\u5E44\u3001\u5C45\u4E2D\u8C03\u5EA6\u3001\u7EDF\u9886\u5168\u5C40\u3001\u6838\u5FC3\u51B3\u7B56\u3002",\u4E07\u7269\u7C7B\u8C61:{\u6982\u5 u4E94\u884C\u5C5E\u6728\u3002\u9707\u96F7\u60CA\u52A8\u3001\u4F24\u95E8\u5982\u96F7\u51FB\u52A8\u8361\u3002\u4E3B\u4F24\u5BB3\u635F\u5931\u3001\u4E89\u6597\u662F\u975E\u3002\u4E0E\u5929\u51B2\u661F\u5BF9\u5E94\u3002\u52A8\u5219\u751F\u707E\uFF0C\u51FA\u884C\u591A\u4E8B\u3002\u4F46\u5229\u4E8E\u8FFD\u6355\u8FFD\u503A\u3001\u6267\u6CD5\u7ADE\u6280\u3001\u9A7E\u8F66\u51FA\u884C\uFF08\u56E0\u4F24\u95E8\u4E3B\u8FD0\u52A8\u4E0E\u8F66\u8F86\uFF09\u3002\u6D4B\u8F66\u8F86\u884C\u7A0B\u770B\u4F24\u95E8",\u5409\u51F6:"\u51F6\u95E8\u3002\u4E3B\u4F24\u707E\u3001\u635F\u5931\u3001\u4E89\u6597\u3001\u53D7\u4F24\u3002\u5229\u4E8E\u72E9\u730E\u3001\u8FFD\u503A\u3001\u7ADE\u6280\u3001\u6267\u6CD5\u3001\u51FA\u5DEE\u3002",\u4E07\u7269\u7C7B\u8C61:{\u6982\u5FF5:"\u4F24\u5BB3\u3001\u635F\u574F\u3001\u6B8B\u7F3A\u3001\u6597\u4E89\u3001\u51B2\u7A81\u3001\u66B4\u529B\u3001\u7834\u635F\u3001\u8FFD\u6355\u3001\u7ADE\u4E89\u3001\u7EF4\u4FEE\u3001\u8FD0\u52A8\u3001\u6025\u901F",\u5929\u65F6:"\u96F7\u66B4\u3001\u72C2\u98CE\u3001\u66B4\u96E8\u3001\u5730\u9707\u3001\u96F7\u51FB\u3001\u60CA\u86F0",\u5730\u7406:"\u8F66\u7978\u73B0\u573A\u3001\u5DE5\u5730\u3001\u62C6\u8FC1\u533A\u3001\u533B\u9662\u6025\u8BCA\u3001\u7EF4\u4FEE\u8F66\u95F4\u3001\u6218\u573A\u3001\u8FD0\u52A8\u573A\u3001\u8F66\u7AD9",\u4EBA\u7269:"\u4F24\u8005\u3001\u519B\u4EBA\u3001\u5C60\u592B\u3001\u730E\u4EBA\u3001\u957F\u7537\u3001\u8FD0\u52A8\u5458\u3001\u7EF4\u4FEE\u5DE5\u3001\u5916\u79D1\u533B\u751F\u3001\u53F8\u673A",\u6027\u60C5:"\u597D\u52C7\u6597\u72E0\u3001\u6025\u8E81\u51B2\u52A8\u3001\u597D\u80DC\u5FC3\u5F3A\u3001\u9C81\u83BD\u76F4\u7387\u3001\u66B4\u8E81\u3001\u884C\u52A8\u8FC5\u901F",\u4EBA\u4F53:"\u809D\u80C6\u3001\u56DB\u80A2\u53D7\u4F24\u3001\u7B4B\u9AA8\u635F\u4F24\u3001\u624B\u811A\u3001\u5916\u4F24\u3001\u9AA8\u6298",\u9759\u7269:"\u5200\u5177\u3001\u5DE5\u5177\u3001\u8F66\u8F86\u3001\u6B66\u5668\u3001\u62D0\u6756\u3001\u7EF7\u5E26\u3001\u4EA4\u901A\u5DE5\u5177",\u8272\u5F69:"\u78A7\u7EFF\u8272\u3001\u9752\u8272",\u5176\u5B83:"\u4F24\u95E8\u4E3B\u635F\u4F24\u548C\u8F66\u8F86\uFF0C\u4E34\u4E4B\u6709\u4F24\u707E\u4E4B\u5FE7\u3002\u6D4B\u9A7E\u8F66\u51FA\u884C\u770B\u4F24\u95E8\u3002\u4EE3\u8868\u6253\u67B6\u3001\u8F66\u7978\u3001\u53D7\u4F24\u3001\u624B\u672F\u3001\u7EF4\u4FEE\u3001\u51FA\u5DEE\u7B49"}},\u675C\u95E8:{\u4E94\u884C:"\u6728",\u65B9\u4F4D:"\u4E1C\u5357",\u5366\u5BAB:"\u5DFD\u56DB\u5BAB",\u6027\u8D28:"\u4E2D",\u95E8\u6027:"\u675C\u95E8\u5C45\u5DFD\u56DB\u5BAB\uFF0C\u4E94\u884C\u5C5E\u6728\u3002\u5DFD\u4E3A\u98CE\u4E3A\u9690\u4E3A\u5165\uFF0C\u675C\u95E8\u5982\u95E8\u6237\u7D27\u95ED\u3001\u98CE\u4E0D\u5165\u5185\u3002\u4E3B\u9690\u85CF\u95ED\u585E\u3001\u675C\u7EDD\u4E0D\u901A\u3002\u4E0E\u5929\u8F85\u661F\u5BF9\u5E94\u3002\u5B9C\u85CF\u4E0D\u5B9C\u9732\uFF0C\u5229\u4E8E\u9690\u9041\u8EB2\u907F\u3001\u4FDD\u5B88\u79D8\u5BC6\u3001\u6F5C\u4F0F\u3002\u4F46\u85CF\u8EAB\u5229\u7528\u5F97\u5F53\u53EF\u5316\u51F6\u4E3A\u5409\u3002\u6D4B\u9003\u8DD1\u85CF\u533F\u770B\u675C\u95E8",\u5409\u51F6:"\u4E2D\u5E73\u4E4B\u95E8\u3002\u5229\u4E8E\u9690\u85CF\u3001\u8EB2\u907F\u3001\u4FEE\u884C\u3001\u4FDD\u5BC6\u3001\u9632\u5B88\u3001\u6F5C\u4F0F\u3002\u4E0D\u5229\u6C42\u8C0B\u51FA\u884C\u3002",\u4E07\u7269\u7C7B\u8C61:{\u6982\u5FF5:"\u9690\u85CF\u3001\u5835\u585E\u3001\u5C01\u95ED\u3001\u4FDD\u5BC6\u3001\u8EB2\u907F\u3001\u675C\u7EDD\u3001\u9690\u533F\u3001\u9632\u5B88\u3001\u5835\u622A\u3001\u6F5C\u4F0F\u3001\u6697\u4E2D\u3001\u5C01\u9501\u3001\u4E0D\u901A",\u5929\u65F6:"\u9634\u5929\u3001\u5FAE\u98CE\u3001\u8584\u96FE\u3001\u973E\u96FE\u4E0D\u5F00\u3001\u95F7\u6C14",\u5730\u7406:"\u5BC6\u5BA4\u3001\u5730\u4E0B\u5BA4\u3001\u9632\u7A7A\u6D1E\u3001\u76D1\u72F1\u3001\u5C71\u6D1E\u3001\u96A7\u9053\u3001\u6697\u5BA4\u3001\u85CF\u8EAB\u5904\u3001\u56FE\u4E66\u9986\u3001\u7814\u7A76\u6240",\u4EBA\u7269:"\u9690\u58EB\u3001\u95F4\u8C0D\u3001\u5BC6\u63A2\u3001\u6280\u672F\u4EBA\u5458\u3001\u957F\u5973\u3001\u50E7\u5C3C\u3001\u85CF\u533F\u8005\u3001\u6280\u672F\u5B85",\u6027\u60C5:"\u5185\u5411\u9690\u5FCD\u3001\u5584\u4E8E\u9690\u85CF\u3001\u5FC3\u601D\u7F1C\u5BC6\u3001\u4E0D\u5584\u4EA4\u9645\u3001\u6C89\u9ED8\u5BE1\u8A00\u3001\u5584\u4E8E\u4FDD\u5BC6",\u4EBA\u4F53:"\u547C\u5438\u9053\u6897\u963B\u3001\u80A0\u9053\u6897\u585E\u3001\u8033\u804B\u3001\u9F3B\u585E\u3001\u4FBF\u79D8",\u9759\u7269:"\u9501\u3001\u95E8\u6813\u3001\u4FDD\u9669\u7BB1\u3001\u5BC6\u7801\u3001\u4FE1\u5C01\u3001\u6697\u5668\u3001\u9501\u5177\u3001\u5BC6\u7801\u7BB1",\u8272\u5F69:"\u9752\u8272\u3001\u6DF1\u7EFF\u8272",\u5176\u5B83:"\u675C\u95E8\u4E3B\u95ED\u585E\u85CF\u533F\uFF0C\u4E34\u4E4B\u4FE1\u606F\u4E0D\u901A\uFF0C\u4E8B\u96BE\u6210\u3002\u5229\u4E8E\u85CF\u533F\u3001\u4FDD\u5B88\u79D8\u5BC6\u3001\u4FEE\u884C\u907F\u4E16\u3002\u6D4B\u9003\u8DD1\u770B\u675C\u95E8\u65B9\u5411"}},\u666F\u95E8:{\u4E94\u884C:"\u706B",\u65B9\u4F4D:"\u5357",\u5366\u5BAB:"\u79BB\u4E5D\u5BAB",\u6027\u8D28:"\u4E2D",\u95E8\u6027:"\u666F\u95E8\u5C45\u79BB\u4E5D\u5BAB\uFF0C\u4E94\u884C\u5C5E\u706B\u3002\u79BB\u706B\u9644\u4E3D\u3001\u666F\u95E8\u5982\u9633\u5149\u7167\u8000\u4E07\u7269\u7686\u53EF\u89C1\u3002\u4E3B\u5149\u660E\u7F8E\u4E3D\u3001\u6587\u4E66\u4FE1\u606F\u3001\u5BA3\u4F20\u5E7F\u544A\u3002\u4E0E\u5929\u82F1\u661F\u5BF9\u5E94\u3002\u5229\u4E8E\u8003\u8BD5\u6587\u4E66\u3001\u5BA3\u4F20\u9020\u52BF\u3001\u6587\u827A\u521B\u4F5C\u3002\u4F46\u666F\u95E8\u534E\u800C\u4E0D\u5B9E\uFF0C\u865A\u591A\u5B9E\u5C11\u3002\u6D4B\u8003\u8BD5\u5347\u5B66\u4EE5\u666F\u95E8\u4E3A\u91CD\u8981\u53C2\u8003",\u5409\u51F6:"\u4E2D\u5E73\u4E4B\u95E8\u3002\u5229\u8003\u8BD5\u3001\u6587\u4E66\u3001\u827A\u672F\u3001\u996E\u9152\u4F5C\u4E50\u3001\u53D1\u4FE1\u606F\u3002\u5FCC\u8FDC\u884C\u51FA\u884C\u3002",\u4E07\u7269\u7C7B\u8C61:{\u6982\u5FF5:"\u5149\u660E\u3001\u7F8E\u4E3D\u3001\u6587\u4E66\u3001\u4FE1\u606F\u3001\u5BA3\u4F20\u3001\u5E7F\u544A\u3001\u88C5\u9970\u3001\u8003\u8BD5\u3001\u534E\u4E3D\u3001\u865A\u8363\u3001\u6587\u5316\u3001\u8BAF\u606F",\u5929\u65F6:"\u70C8\u65E5\u3001\u5F69\u971E\u3001\u8679\u5149\u3001\u6674\u7A7A\u4E07\u91CC\u3001\u4E2D\u5348\u9633\u5149\u3001\u6781\u5149",\u5730\u7406:"\u7F8E\u672F\u9986\u3001\u5267\u9662\u3001\u706F\u5854\u3001\u5E7F\u544A\u724C\u3001\u7E41\u534E\u5546\u4E1A\u533A\u3001\u666F\u70B9\u3001\u5C55\u89C8\u9986\u3001\u8003\u573A",\u4EBA\u7269:"\u6587\u4EBA\u3001\u753B\u5BB6\u3001\u6B4C\u624B\u3001\u8BB0\u8005\u3001\u4E2D\u5973\u3001\u901A\u8BAF\u5458\u3001\u8BBE\u8BA1\u5E08\u3001\u5E7F\u544A\u4EBA\u3001\u7F51\u7EA2\u3001\u8003\u751F",\u6027\u60C5:"\u70ED\u60C5\u5F00\u6717\u3001\u8FFD\u6C42\u7F8E\u611F\u3001\u5584\u4E8E\u8868\u8FBE\u3001\u865A\u8363\u6D6E\u534E\u3001\u6CE8\u91CD\u5916\u8868\u3001\u6587\u91C7\u98DE\u626C",\u4EBA\u4F53:"\u5FC3\u810F\u3001\u773C\u775B\u3001\u8840\u6DB2\u5FAA\u73AF\u3001\u89C6\u529B",\u9759\u7269:"\u6587\u4E66\u3001\u8BC1\u4EF6\u3001\u4FE1\u4EF6\u3001\u5E7F\u544A\u3001\u753B\u4F5C\u3001\u706F\u5177\u3001\u5C4F\u5E55\u3001\u7535\u89C6\u3001\u8BD5\u5377",\u8272\u5F69:"\u7EA2\u8272\u3001\u7D2B\u8272\u3001\u6A59\u8272",\u5176\u5B83:"\u666F\u95E8\u4E3B\u6587\u4E66\u4FE1\u606F\uFF0C\u4E34\u4E4B\u6709\u6D88\u606F\u4F20\u8FBE\u3002\u5229\u4E8E\u8003\u8BD5\u3001\u53D1\u6587\u7AE0\u3001\u5BA3\u4F20\u63A8\u5E7F\u3002\u4EE3\u8868\u6587\u5316\u3001\u6D88\u606F\u3001\u4FE1\u4EF6\u3001\u8003\u8BD5\u6210\u7EE9\u7B49"}},\u6B7B\u95E8:{\u4E94\u884C:"\u571F",\u65B9\u4F4D:"\u897F\u5357",\u5366\u5BAB:"\u5764\u4E8C\u5BAB",\u6027\u8D28:"\u51F6",\u95E8\u6027:"\u6B7B\u95E8\u5C45\u5764\u4E8C\u5BAB\uFF0C\u4E94\u884C\u5C5E\u571F\u3002\u5764\u4E3A\u5730\u4E3A\u6BCD\u4E3A\u987A\uFF0C\u4F46\u6B7B\u95E8\u8C61\u5F81\u4E07\u7269\u5F52\u4E8E\u5927\u5730\u3001\u4E00\u5207\u7EC8\u7ED3\u3002\u4E3B\u6B7B\u4EA1\u51CB\u96F6\u3001\u4E07\u7269\u67AF\u7AED\u3002\u4E0E\u5929\u82AE\u661F\u5BF9\u5E94\u3002\u6700\u5FCC\u7528\u4E8E\u6D3B\u4EBA\u4E4B\u4E8B\uFF0C\u4F46\u5229\u4E8E\u5904\u7406\u7ED3\u675F\u3001\u544A\u522B\u3001\u4E27\u846C\u3001\u884C\u5211\u3001\u6C38\u8BC0\u3002\u6D4B\u9634\u5B85\u98CE\u6C34\u4EE5\u6B7B\u95E8\u4E3A\u7528",\u5409\u51F6:"\u51F6\u95E8\u3002\u4E3B\u6B7B\u4EA1\u3001\u505C\u6EDE\u3001\u7EC8\u7ED3\u3002\u5229\u4E8E\u4E27\u846C\u3001\u9493\u9C7C\u3001\u6355\u730E\u3001\u4E86\u7ED3\u65E7\u4E8B\u3001\u884C\u5211\u3002",\u4E07\u7269\u7C7B\u8C61:{\u6982\u5FF5:"\u6B7B\u4EA1\u3001\u7ED3\u675F\u3001\u505C\u6B62\u3001\u65AD\u7EDD\u3001\u6D88\u4EA1\u3001\u4E86\u7ED3\u3001\u51CB\u96F6\u3001\u7EC8\u6B62\u3001\u51B7\u6F20\u3001\u9EBB\u6728\u3001\u7EDD\u75C7\u3001\u6C38\u8BC0",\u5929\u65F6:"\u9634\u6C89\u3001\u9177\u6691\u3001\u95F7\u70ED\u65E0\u98CE\u3001\u67AF\u840E\u5B63\u8282\u3001\u4E07\u7269\u51CB\u96F6",\u5730\u7406:"\u575F\u5893\u3001\u6BA1\u4EEA\u9986\u3001\u5E9F\u589F\u3001\u8352\u5730\u3001\u505C\u5C38\u623F\u3001\u5783\u573E\u573A\u3001\u65E7\u5C4B\u3001\u5893\u5730\u3001\u9675\u56ED",\u4EBA\u7269:"\u6B7B\u8005\u3001\u4E27\u5BB6\u3001\u6BA1\u4EEA\u5DE5\u4F5C\u8005\u3001\u8001\u5987\u3001\u7EDD\u671B\u8005\u3001\u9000\u51FA\u8005\u3001\u98CE\u6C34\u5E08",\u6027\u60C5:"\u6D88\u6781\u88AB\u52A8\u3001\u56FA\u6267\u4FDD\u5B88\u3001\u4E0D\u601D\u8FDB\u53D6\u3001\u7F3A\u4E4F\u6D3B\u529B\u3001\u51B7\u6F20\u65E0\u60C5\u3001\u4E86\u65E0\u751F\u6C14",\u4EBA\u4F53:"\u813E\u80C3\u3001\u8179\u90E8\u3001\u80BF\u7624\u3001\u574F\u6B7B\u7EC4\u7EC7\u3001\u4E0D\u6CBB\u4E4B\u75C7\u3001\u7EDD\u75C7",\u9759\u7269:"\u68FA\u6750\u3001\u5BFF\u8863\u3001\u796D\u54C1\u3001\u8352\u5E9F\u7269\u54C1\u3001\u65E7\u8D27\u3001\u5893\u7891",\u8272\u5F69:"\u9EC4\u8272\u3001\u571F\u8272\u3001\u6697\u8272",\u5176\u5B83:"\u6B7B\u95E8\u4E3B\u6B7B\u7EDD\uFF0C\u4E34\u4E4B\u8BF8\u4E8B\u4E0D\u5229\u3002\u6D4B\u75C5\u51F6\uFF0C\u6D4B\u4E8B\u96BE\u6210\u3002\u4F46\u5229\u4E8E\u4E86\u7ED3\u65E7\u503A\u3001\u7ED3\u675F\u5173\u7CFB\u3001\u5904\u7406\u540E\u4E8B\u3001\u9009\u9634\u5B85"}},\u60CA\u95E8:{\u4E94\u884C:"\u91D1",\u65B9\u4F4D:"\u897F",\u5366\u5BAB:"\u5151\u4E03\u5BAB",\u6027\u8D28:"\u51F6",\u95E8\u6027:"\u60CA\u95E8\u5C45\u5151\u4E03\u5BAB\uFF0C\u4E94\u884C\u5C5E\u91D1\u3002\u5151\u4E3A\u53E3\u4E3A\u6CFD\u4E3A\u60A6\uFF0C\u60CA\u95E8\u5982\u53E3\u51FA\u60CA\u4EBA\u4E4B\u8BED\u3001\u4EE4\u4EBA\u80C6\u5BD2\u3002\u4E3B\u60CA\u6050\u4E0D\u5B89\u3001\u53E3\u820C\u662F\u975E\u3001\u5B98\u8BBC\u8BC9\u8BBC\u3002\u4E0E\u5929\u67F1\u661F\u5BF9\u5E94\u3002\u5B9C\u6597\u8BBC\u5B98\u904F\u90AA\uFF0C\u641C\u6355\u76D7\u8D3C\u3001\u8BBE\u4F0F\u5E03\u5175\u3001\u8D4C\u535A\u6E38\u620F\u3002\u5176\u4F59\u8BF8\u4E8B\u4E0D\u5229\u3002\u6D4B\u5B98\u53F8\u8BC9\u8BBC\u4EE5\u60CA\u95E8\u4E3A\u91CD\u8981\u53C2\u8003",\u5409\u51F6:"\u51F6\u95E8\u3002\u4E3B\u60CA\u5413\u3001\u5B98\u975E\u3001\u53E3\u820C\u3002\u5229\u4E8E\u8BBC\u8BC9\u3001\u5E03\u9053\u3001\u6CD5\u5F8B\u8C03\u89E3\u3001\u641C\u6355\u3002",\u4E07\u7269\u7C7B\u8C61:{\u6982\u5FF5:"\u60CA\u6050\u3001\u5947\u602A\u3001\u523A\u6FC0\u3001\u5403\u60CA\u3001\u8BBD\u523A\u3001\u60CA\u9B42\u3001\u6050\u614C\u3001\u58F0\u97F3\u3001\u5B98\u975E\u3001\u53E3\u820C\u662F\u975E\u3001\u6096\u9006\u3001\u97F3\u4E50\u3001\u54CD\u58F0\u3001\u8BC9\u8BBC",\u5929\u65F6:"\u72C2\u98CE\u66B4\u96E8\u3001\u79CB\u98CE\u3001\u5929\u6C14\u7A81\u53D8\u3001\u51C9\u723D\u3001\u971C\u3001\u96F7\u9E23",\u5730\u7406:"\u6E56\u6CCA\u3001\u6CBC\u6CFD\u3001\u6C34\u5E93\u3001\u95F9\u5E02\u3001\u6B4C\u5385\u3001\u5A31\u4E50\u573A\u6240\u3001\u7403\u573A\u3001\u6F14\u64AD\u5385\u3001\u6CD5\u9662\u3001\u5F8B\u5E08\u4E8B\u52A1\u6240",\u4EBA\u7269:"\u5F8B\u5E08\u3001\u6B4C\u661F\u3001\u7EAA\u68C0\u76D1\u5BDF\u4EBA\u5458\u3001\u519B\u4EBA\u3001\u5916\u4EA4\u5B98\u3001\u7259\u79D1\u533B\u751F\u3001\u6CD5\u5B98\u3001\u68C0\u5BDF\u5B98",\u6027\u60C5:"\u80FD\u8BF4\u4F1A\u9053\u3001\u60CA\u6050\u4E0D\u5B89\u3001\u62C5\u60CA\u53D7\u6015\u3001\u5FC3\u4E8B\u91CD\u91CD\u3001\u5FC3\u60CA\u80C6\u8DF3\u3001\u5584\u4E8E\u96C4\u8FA9",\u5F62\u6001:"\u9762\u767D\u97F3\u54CD\u3001\u53E3\u9F7F\u4F36\u4FD0\u3001\u795E\u8272\u60CA\u60F6",\u4EBA\u4F53:"\u5589\u5499\u3001\u58F0\u5E26\u3001\u7259\u9F7F\u3001\u80BA\u90E8\u3001\u6C14\u7BA1\u3001\u53E3\u8154\u3001\u820C",\u9759\u7269:"\u949F\u94C3\u3001\u94C1\u5668\u3001\u95F9\u949F\u3001\u7535\u8BDD\u3001\u4E50\u5668\u3001\u97AD\u70AE\u3001\u8B66\u62A5\u5668\u3001\u6CD5\u69CC",\u8272\u5F69:"\u767D\u8272\u3001\u91D1\u8272\u3001\u94F6\u767D\u8272",\u5176\u5B83:"\u60CA\u95E8\u4E3B\u53E3\u820C\u5B98\u8BBC\uFF0C\u4E34\u4E4B\u4E3B\u6709\u60CA\u6050\u5B98\u975E\u3002\u4EE3\u8868\u5B98\u53F8\u3001\u8BC9\u8BBC\u3001\u8FA9\u8BBA\u3001\u53D7\u60CA\u3001\u610F\u5916\u3001\u88AB\u8D28\u8BE2\u7B49"}}};var An={\u503C\u7B26:{\u6027\u8D28:"\u5927\u5409",\u795E\u6027:"\u503C\u7B26\u4E3A\u8BF8\u795E\u4E4B\u9996\uFF0C\u81F3\u5C0A\u81F3\u8D35\u3002\u503C\u7B26\u662F\u5F53\u503C\u7684\u7532\u6240\u9041\u7684\u516D\u4EEA\u5BF9\u5E94\u7684\u5929\u76D8\u661F\uFF0C\u4EE3\u8868\u6700\u5C0A\u8D35\u7684\u529B\u91CF\u3002\u5728\u5947\u95E8\u4E2D\u503C\u7B26\u968F\u5929\u76D8\u8F6C\u52A8\uFF0C\u4E3A\u4E00\u5C40\u4E4B\u4E3B\u3002\u503C\u7B26\u4E34\u4E4B\u767E\u4E8B\u7686\u5409\uFF0C\u51F6\u683C\u9022\u503C\u7B26\u4E5F\u80FD\u51CF\u51F6\u3002\u4E3A\u6700\u5927\u7684\u8D35\u4EBA\u3001\u9760\u5C71\u3002\u4EE3\u8868\u9886\u5BFC\u7684\u6001\u5EA6\u548C\u610F\u5411",\u4E07\u7269\u7C7B\u8C61:{\u6982\u5FF5:"\u6743\u5A01\u3001\u5C0A\u8D35\u3001\u4FE1\u7528\u3001\u6B63\u4E49\u3001\u9886\u5BFC\u3001\u8D35\u4EBA\u3001\u4FDD\u62A4\u3001\u4FE1\u4EFB\u3001\u6276\u6301\u3001\u6B63\u7EDF\u3001\u6700\u9AD8\u3001\u6838\u5FC3\u3001\u9760\u5C71\u3001\u5B98\u5370",\u5929\u65F6:"\u6674\u6717\u3001\u9633\u5149\u666E\u7167\u3001\u98CE\u548C\u65E5\u4E3D\u3001\u4E07\u91CC\u65E0\u4E91",\u5730\u7406:"\u653F\u5E9C\u673A\u5173\u3001\u9996\u957F\u529E\u516C\u5BA4\u3001\u94F6\u884C\u3001\u91D1\u878D\u4E2D\u5FC3\u3001\u6743\u529B\u4E2D\u67A2\u3001\u603B\u88C1\u5BA4",\u4EBA\u7269:"\u8D35\u4EBA\u3001\u9886\u5BFC\u3001\u5C0A\u957F\u3001\u4E0A\u7EA7\u3001\u8001\u677F\u3001\u603B\u88C1\u3001\u5FB7\u9AD8\u671B\u91CD\u4E4B\u4EBA\u3001\u6700\u9AD8\u9886\u5BFC\u3001\u6069\u4EBA",\u6027\u60C5:"\u5A01\u4E25\u5C0A\u8D35\u3001\u6B63\u76F4\u516C\u6B63\u3001\u6709\u6743\u5A01\u3001\u8BB2\u4FE1\u7528\u3001\u5149\u660E\u78CA\u843D\u3001\u503C\u5F97\u4FE1\u8D56",\u4EBA\u4F53:"\u5934\u90E8\u3001\u5FC3\u810F\u3001\u6574\u4F53\u7CBE\u6C14\u795E",\u9759\u7269:"\u5370\u7AE0\u3001\u65D7\u5E1C\u3001\u8BC1\u4E66\u3001\u5956\u676F\u3001\u91D1\u5668\u3001\u52CB\u7AE0\u3001\u6743\u6756\u3001\u56FD\u65D7",\u8272\u5F69:"\u91D1\u9EC4\u8272\u3001\u7D2B\u8272",\u5176\u5B83:"\u503C\u7B26\u4E34\u4E4B\u8BF8\u4E8B\u5927\u5409\uFF0C\u6709\u8D35\u4EBA\u6276\u52A9\u3002\u5373\u4FBF\u51F6\u683C\u9022\u503C\u7B26\u4EA6\u80FD\u51CF\u51F6\u3002\u4EE3\u8868\u6B63\u4E49\u3001\u6743\u529B\u3001\u6838\u5FC3\u3001\u9886\u5BFC\u610F\u5411\u3001\u56FD\u5BB6\u884C\u4E3A\u7B49"}},\u817E\u86C7:{\u6027\u8D28:"\u51F6",\u795E\u6027:"\u817E\u86C7\u4E3B\u865A\u60CA\u602A\u5F02\u3001\u60CA\u6050\u4E0D\u5B89\u3002\u6027\u865A\u8BC8\u591A\u53D8\u5982\u86C7\u822C\u7F20\u7ED5\u3002\u817E\u86C7\u4E94\u884C\u5C5E\u706B\uFF08\u4E01\u706B\u5BC4\u751F\uFF09\uFF0C\u5F62\u4F53\u5982\u86C7\u5584\u7F20\u7ED5\uFF0C\u53C8\u80FD\u817E\u98DE\u53D8\u5316\u3002\u5728\u5947\u95E8\u4E2D\u4EE3\u8868\u4E0D\u771F\u5B9E\u7684\u4FE1\u606F\u3001\u865A\u5047\u7684\u8868\u8C61\u3001\u602A\u5F02\u7684\u73B0\u8C61\u3002\u9022\u4E4B\u591A\u865A\u60CA\u3001\u602A\u68A6\u3001\u5669\u8017\u3001\u60CA\u6050\u3001\u7F20\u8EAB\u4E4B\u4E8B",\u4E07\u7269\u7C7B\u8C61:{\u6982\u5FF5:"\u865A\u60CA\u3001\u602A\u5F02\u3001\u7EA0\u7F20\u3001\u6050\u60E7\u3001\u5669\u68A6\u3001\u5E7B\u89C9\u3001\u53D8\u5316\u65E0\u5E38\u3001\u6346\u7ED1\u3001\u7F20\u7ED5\u3001\u5F2F\u66F2\u3001\u865A\u5047\u3001\u7075\u5F02\u3001\u60CA\u609A\u3001\u8BE1\u5F02",\u5929\u65F6:"\u95EA\u7535\u3001\u9634\u68EE\u5929\u6C14\u3001\u602A\u5F02\u5929\u8C61\u3001\u96FE\u8499\u8499\u3001\u706B\u70E7\u4E91",\u5730\u7406:"\u602A\u5F02\u4E4B\u5904\u3001\u5F2F\u66F2\u5C0F\u9053\u3001\u86C7\u7A74\u3001\u8FF7\u5BAB\u3001\u53E4\u602A\u5EFA\u7B51\u3001\u7075\u5F02\u573A\u6240\u3001\u5F2F\u8DEF",\u4EBA\u7269:"\u602A\u5F02\u4E4B\u4EBA\u3001\u865A\u4F2A\u8005\u3001\u7CBE\u795E\u75C5\u60A3\u8005\u3001\u 53CC\u4EFD\u7269\u54C1",\u8272\u5F69:"\u7EFF\u8272\u3001\u9752\u8272\u3001\u78A7\u8272",\u5176\u5B83:"\u516D\u5408\u4E3B\u548C\u5408\uFF0C\u4E34\u4E4B\u5229\u4E8E\u5A5A\u59FB\u3001\u5408\u4F5C\u3001\u4EA4\u6613\u7B49\u3002\u4EE3\u8868\u56E2\u805A\u3001\u548C\u89E3\u3001\u8054\u76DF\u3002\u51E1\u6D4B\u5A5A\u59FB\u611F\u60C5\u4EE5\u516D\u5408\u4E3A\u91CD\u8981\u53C2\u8003"}},\u767D\u864E:{\u6027\u8D28:"\u51F6",\u795E\u6027:"\u767D\u864E\u4E3B\u5200\u5175\u8840\u5149\u3001\u51F6\u9669\u66B4\u529B\u3002\u767D\u864E\u4E94\u884C\u5C5E\u91D1\uFF08\u5E9A\u91D1\uFF09\uFF0C\u6027\u672C\u51F6\u731B\u6B8B\u66B4\uFF0C\u4E3B\u6740\u4F10\u5211\u7F5A\u3002\u5728\u9633\u9041\u4E2D\u5C45\u7B2C\u4E94\u4F4D\u3002\u767D\u864E\u51FA\u6CA1\u5FC5\u6709\u51F6\u4E8B\uFF0C\u4E3B\u6D41\u8840\u53D7\u4F24\u3001\u8840\u5149\u4E4B\u707E\u3002\u5728\u5947\u95E8\u4E2D\u767D\u864E\u4EE3\u8868\u516C\u68C0\u6CD5\u529B\u91CF\u3001\u624B\u672F\u5200\u3001\u66B4\u529B\u4E8B\u4EF6\u3002\u9634\u9041\u65F6\u767D\u864E\u4F4D\u7531\u52FE\u9648\u66FF\u4EE3",\u4E07\u7269\u7C7B\u8C61:{\u6982\u5FF5:"\u8840\u5149\u3001\u5200\u5175\u3001\u66B4\u529B\u3001\u6740\u4F10\u3001\u5211\u7F5A\u3001\u624B\u672F\u3001\u8F66\u7978\u3001\u6253\u67B6\u3001\u6050\u6016\u3001\u51F6\u9669\u3001\u6B7B\u4EA1\u3001\u4E27\u846C",\u5929\u65F6:"\u66B4\u98CE\u9AA4\u96E8\u3001\u51B0\u96F9\u3001\u5929\u707E\u3001\u6C99\u5C18\u66B4",\u5730\u7406:"\u6218\u573A\u3001\u5211\u573A\u3001\u5C60\u5BB0\u573A\u3001\u624B\u672F\u5BA4\u3001\u4E8B\u6545\u73B0\u573A\u3001\u6BA1\u4EEA\u9986\u3001\u516C\u5B89\u5C40\u3001\u6CD5\u9662",\u4EBA\u7269:"\u519B\u4EBA\u3001\u8B66\u5BDF\u3001\u5C60\u592B\u3001\u51F6\u624B\u3001\u5916\u79D1\u533B\u751F\u3001\u6B66\u672F\u5BB6\u3001\u6253\u624B\u3001\u52AB\u532A\u3001\u6267\u6CD5\u8005",\u6027\u60C5:"\u51F6\u731B\u66B4\u70C8\u3001\u6740\u4F10\u679C\u65AD\u3001\u66B4\u529B\u503E\u5411\u3001\u521A\u786C\u65E0\u60C5\u3001\u55DC\u8840\u597D\u6597",\u5F62\u6001:"\u9762\u767D\u6709\u5A01\u3001\u76EE\u5149\u51F6\u5389\u3001\u4F53\u683C\u58EE\u7855",\u4EBA\u4F53:"\u9AA8\u6298\u3001\u5200\u4F24\u3001\u624B\u672F\u5207\u53E3\u3001\u5916\u4F24\u3001\u6D41\u8840\u3001\u91D1\u5C5E\u4F24",\u9759\u7269:"\u5200\u5251\u3001\u6B66\u5668\u3001\u624B\u672F\u5200\u3001\u94C1\u5668\u3001\u767D\u8272\u91D1\u5C5E\u7269\u3001\u8B66\u68B0\u3001\u624B\u94D0",\u8272\u5F69:"\u767D\u8272\u3001\u8840\u7EA2\u8272",\u5176\u5B83:"\u767D\u864E\u4E3B\u51F6\u66B4\uFF0C\u4E34\u4E4B\u4E3B\u8840\u5149\u4E4B\u707E\u3001\u624B\u672F\u5200\u4F24\u3002\u4EE3\u8868\u6218\u4E89\u3001\u66B4\u529B\u3001\u6B7B\u4EA1\u3001\u4E27\u4E8B\u3002\u4F46\u5229\u4E8E\u6267\u6CD5\u3001\u624B\u672F\u3001\u6253\u51FB\u72AF\u7F6A\u3002\u9634\u9041\u65F6\u7531\u52FE\u9648\u66FF\u4EE3"}},\u7384\u6B66:{\u6027\u8D28:"\u51F6",\u795E\u6027:"\u7384\u6B66\u4E3B\u76D7\u8D3C\u6697\u6627\u3001\u6B3A\u8BC8\u865A\u4F2A\u3002\u7384\u6B66\u4E94\u884C\u5C5E\u6C34\uFF08\u7678\u6C34\uFF09\uFF0C\u6027\u9634\u6697\u72E1\u8BC8\u3002\u5728\u9633\u9041\u4E2D\u5C45\u7B2C\u516D\u4F4D\u3002\u5584\u4E8E\u5077\u76D7\u6B3A\u9A97\u3001\u6697\u4E2D\u884C\u4E8B\u3002\u5728\u5947\u95E8\u4E2D\u4EE3\u8868\u76D7\u8D3C\u3001\u9A97\u5B50\u3001\u79C1\u60C5\u3001\u6697\u4E8B\u3002\u51E1\u6D4B\u5931\u7269\u4EE5\u7384\u6B66\u843D\u5BAB\u770B\u5C0F\u5077\u65B9\u5411\u3002\u9634\u9041\u65F6\u7384\u6B66\u4F4D\u7531\u6731\u96C0\u66FF\u4EE3",\u4E07\u7269\u7C7B\u8C61:{\u6982\u5FF5:"\u76D7\u7A83\u3001\u6B3A\u9A97\u3001\u8D70\u79C1\u3001\u5077\u60C5\u3001\u6697\u5BB3\u3001\u5931\u7269\u3001\u8BC8\u9A97\u3001\u80CC\u53DB\u3001\u9634\u8C0B\u3001\u6697\u4E2D\u884C\u4E8B\u3001\u6843\u8272\u4E8B\u4EF6",\u5929\u65F6:"\u66B4\u96E8\u3001\u9ED1\u591C\u3001\u4F38\u624B\u4E0D\u89C1\u4E94\u6307\u3001\u51B0\u5929\u96EA\u5730\u3001\u5927\u96FE",\u5730\u7406:"\u9ED1\u6697\u4E4B\u5904\u3001\u8D4C\u573A\u3001\u9ED1\u5E02\u3001\u5730\u4E0B\u94B1\u5E84\u3001\u6697\u5DF7\u3001\u76D7\u7A9F\u3001\u5A31\u4E50\u573A\u6240\u3001\u7537\u6B22\u5973\u7231\u4E4B\u6240",\u4EBA\u7269:"\u5C0F\u5077\u3001\u9A97\u5B50\u3001\u5978\u7EC6\u3001\u6697\u604B\u8005\u3001\u95F4\u8C0D\u3001\u9ED1\u5BA2\u3001\u8D70\u79C1\u8005\u3001\u60C5\u4EBA\u3001\u79C1\u901A\u8005",\u6027\u60C5:"\u72E1\u733E\u5978\u8BC8\u3001\u5077\u5077\u6478\u6478\u3001\u5584\u4E8E\u4F2A\u88C5\u3001\u4E0D\u5149\u660E\u78CA\u843D\u3001\u9634\u9669\u3001\u5584\u4E8E\u6B3A\u9A97",\u4EBA\u4F53:"\u80BE\u810F\u3001\u6CCC\u5C3F\u7CFB\u7EDF\u3001\u6027\u75C5\u3001\u751F\u6B96\u7CFB\u7EDF",\u9759\u7269:"\u9501\u5177\u3001\u6697\u5668\u3001\u5077\u7A83\u5DE5\u5177\u3001\u8D5D\u54C1\u3001\u5047\u8D27\u3001\u5192\u724C\u8D27",\u8272\u5F69:"\u9ED1\u8272\u3001\u6DF1\u8272",\u5176\u5B83:"\u7384\u6B66\u4E3B\u76D7\u8D3C\u79C1\u60C5\uFF0C\u4E34\u4E4B\u4E3B\u5931\u7269\u96BE\u5BFB\u3001\u88AB\u9A97\u53D7\u5BB3\u3002\u6D4B\u5931\u7A83\u770B\u7384\u6B66\uFF0C\u4E5F\u4EE3\u8868\u5077\u60C5\u3001\u79C1\u5954\u3001\u6697\u4E2D\u4E4B\u4E8B\u3002\u9634\u9041\u65F6\u7531\u6731\u96C0\u66FF\u4EE3"}},\u4E5D\u5730:{\u6027\u8D28:"\u5409",\u795E\u6027:"\u4E5D\u5730\u4E3A\u5764\u4E4B\u8C61\uFF0C\u4E3B\u67D4\u987A\u9759\u6B62\u3001\u5B89\u7A33\u5B88\u6210\u3002\u4E5D\u5730\u4E94\u884C\u5C5E\u571F\uFF0C\u6027\u6566\u539A\u5305\u5BB9\u5982\u5927\u5730\uFF0C\u5229\u4E8E\u56FA\u5B88\u9632\u5FA1\u3002\u5728\u5947\u95E8\u4E2D\u4E5D\u5730\u4EE3\u8868\u86F0\u4F0F\u3001\u85CF\u5F62\u3001\u5B88\u52BF\u3002\u5B9C\u5B88\u4E0D\u5B9C\u653B\uFF0C\u5229\u9690\u4F0F\u85CF\u5F62\u3002\u51E1\u6D4B\u4E8B\u5B9C\u9759\u4E0D\u5B9C\u52A8\u3002\u4E5D\u5730\u65B9\u4F4D\u5229\u4E8E\u85CF\u8EAB\u3001\u79EF\u84C4\u529B\u91CF\u3001\u4EE5\u9038\u5F85\u52B3",\u4E07\u7269\u7C7B\u8C61:{\u6982\u5FF5:"\u7A33\u56FA\u3001\u5B88\u6210\u3001\u9759\u6B62\u3001\u5305\u5BB9\u3001\u85CF\u533F\u3001\u9632\u5FA1\u3001\u5B89\u5C45\u3001\u5FCD\u8010\u3001\u539A\u91CD\u3001\u6C89\u7A33\u3001\u86F0\u4F0F\u3001\u4EE5\u9038\u5F85\u52B3\u3001\u50A8\u84C4",\u5929\u65F6:"\u9634\u5929\u3001\u9634\u6C89\u6C89\u3001\u5B89\u9759\u65E0\u98CE\u3001\u4E07\u7269\u86F0\u4F0F",\u5730\u7406:"\u5E73\u539F\u3001\u7530\u5730\u3001\u5730\u4E0B\u5BA4\u3001\u4ED3\u5E93\u3001\u575A\u56FA\u5821\u5792\u3001\u5730\u7A96\u3001\u9632\u7A7A\u6D1E\u3001\u5730\u6D1E",\u4EBA\u7269:"\u6BCD\u4EB2\u3001\u8001\u5987\u3001\u519C\u6C11\u3001\u5B88\u536B\u8005\u3001\u7A33\u91CD\u4E4B\u4EBA\u3001\u5E55\u540E\u7B56\u5212\u8005\u3001\u623F\u4E1C",\u6027\u60C5:"\u6C89\u7A33\u539A\u91CD\u3001\u5B89\u5206\u5B88\u5DF1\u3001\u5305\u5BB9\u5FCD\u8010\u3001\u4FDD\u5B88\u8E0F\u5B9E\u3001\u4EFB\u52B3\u4EFB\u6028\u3001\u5BBD\u539A\u5F85\u4EBA",\u4EBA\u4F53:"\u8179\u90E8\u3001\u813E\u80C3\u3001\u76AE\u80A4",\u9759\u7269:"\u571F\u5730\u3001\u623F\u4EA7\u3001\u5730\u6BEF\u3001\u5EA7\u57AB\u3001\u76FE\u724C\u3001\u5821\u5792\u3001\u5730\u4E0B\u5BA4\u3001\u50A8\u85CF\u54C1",\u8272\u5F69:"\u9EC4\u8272\u3001\u571F\u8272",\u5176\u5B83:"\u4E5D\u5730\u4E3B\u86F0\u4F0F\u5B88\u6210\uFF0C\u4E34\u4E4B\u5B9C\u85CF\u4E0D\u5B9C\u52A8\u3002\u4EE3\u8868\u56FA\u5B88\u3001\u9632\u5FA1\u3001\u5B89\u5C45\u3001\u50A8\u84C4\u3001\u519C\u4E1A\u3002\u5B9C\u4EE5\u9759\u5236\u52A8\u3001\u4EE5\u9038\u5F85\u52B3"}},\u4E5D\u5929:{\u6027\u8D28:"\u5409",\u795E\u6027:"\u4E5D\u5929\u4E3A\u4E7E\u4E4B\u8C61\uFF0C\u4E3B\u521A\u5065\u5411\u4E0A\u3001\u79EF\u6781\u8FDB\u53D6\u3002\u4E5D\u5929\u4E94\u884C\u5C5E\u91D1\uFF0C\u6027\u521A\u5065\u5A01\u731B\u5982\u5929\u3002\u5728\u5947\u95E8\u4E2D\u4E5D\u5929\u4EE3\u8868\u79EF\u6781\u8FDB\u53D6\u3001\u4E3B\u52A8\u51FA\u51FB\u3001\u5411\u4E0A\u53D1\u5C55\u3002\u5B9C\u653B\u4E0D\u5B9C\u5B88\uFF0C\u5229\u8FDC\u884C\u9AD8\u4E3E\u3002\u51E1\u6D4B\u4E8B\u5B9C\u52A8\u4E0D\u5B9C\u9759\u3002\u4E5D\u5929\u65B9\u4F4D\u5229\u4E8E\u626C\u65D7\u5450\u558A\u3001\u8D81\u52BF\u51FA\u51FB\u3001\u58F0\u4E1C\u51FB\u897F",\u4E07\u7269\u7C7B\u8C61:{\u6982\u5FF5:"\u9AD8\u8FDC\u3001\u8FDB\u53D6\u3001\u5411\u4E0A\u3001\u4E3B\u52A8\u3001\u51FA\u51FB\u3001\u6269\u5F20\u3001\u98DE\u7FD4\u3001\u5347\u817E\u3001\u8FDC\u884C\u3001\u91CE\u5FC3\u3001\u58F0\u52BF\u3001\u9AD8\u8C03\u3001\u5F20\u626C",\u5929\u65F6:"\u6674\u6717\u4E07\u91CC\u3001
