    2: { name: '坤二宫', short: '坤二', dir: '西南', gua: '坤', branches: ['未', '申'] },
    3: { name: '震三宫', short: '震三', dir: '正东', gua: '震', branches: ['卯'] },
    4: { name: '巽四宫', short: '巽四', dir: '东南', gua: '巽', branches: ['辰', '巳'] },
    5: { name: '中五宫', short: '中五', dir: '中央', gua: '中', branches: [] },
    6: { name: '乾六宫', short: '乾六', dir: '西北', gua: '乾', branches: ['戌', '亥'] },
    7: { name: '兑七宫', short: '兑七', dir: '正西', gua: '兑', branches: ['酉'] },
    8: { name: '艮八宫', short: '艮八', dir: '东北', gua: '艮', branches: ['丑', '寅'] },
    9: { name: '离九宫', short: '离九', dir: '正南', gua: '离', branches: ['午'] }
  };

  var BRANCH_PALACE = {
    '子': 1, '丑': 8, '寅': 8, '卯': 3, '辰': 4, '巳': 4,
    '午': 9, '未': 2, '申': 2, '酉': 7, '戌': 6, '亥': 6
  };

  /* 时支 -> 驿马（申子辰马在寅，巳酉丑马在亥，寅午戌马在申，亥卯未马在巳） */
  var YI_MA = {
    '申': '寅', '子': '寅', '辰': '寅',
    '巳': '亥', '酉': '亥', '丑': '亥',
    '寅': '申', '午': '申', '戌': '申',
    '亥': '巳', '卯': '巳', '未': '巳'
  };

  /* 特殊格局简释（仅释义，不参与起局计算） */
  var SPECIAL_NOTE = {
    '三奇升殿': { type: '吉', desc: '三奇临本宫正位，主吉庆顺遂，利文书、升迁、喜庆之事。' },
    '奇游禄位': { type: '吉', desc: '三奇游于禄位，主财禄丰盈、事业得助、名利双收。' },
    '三奇得使': { type: '吉', desc: '三奇逢值使门，谋事得力，有贵人相扶，宜主动出击。' },
    '玉女守门': { type: '吉', desc: '丁奇临值使门，主和合喜庆、暗中相助，利婚姻、谈判、密事。' },
    '奇仪相合': { type: '吉', desc: '三奇与六仪相合，主和合成事，亦主牵绊、纠缠。' },
    '门生宫': { type: '平', desc: '门生宫为泄气，事多付出而后得，宜量力而行。' },
    '宫生门': { type: '吉', desc: '宫生门为得地，门之吉凶加倍，吉门更吉。' },
    '门迫宫': { type: '凶', desc: '门克宫为门迫，吉门减吉、凶门加凶，事多受阻。' },
    '宫迫门': { type: '凶', desc: '宫克门为宫迫，门之作用受制，力不从心。' },
    '星入墓': { type: '凶', desc: '九星入墓，力量受困，事多迟滞难成。' },
    '门入墓': { type: '凶', desc: '八门入墓，出入闭阻，谋事难通。' },
    '飞干格': { type: '凶', desc: '庚加日干为飞干格，主变动、远行、争讼是非。' },
    '伏干格': { type: '凶', desc: '日干加庚为伏干格，主停滞受制、进退两难。' },
    '岁格': { type: '凶', desc: '庚加年干为岁格，主与长辈、上峰相关之是非。' },
    '月格': { type: '凶', desc: '庚加月干为月格，主与同辈、同事相关之纠葛。' },
    '奇格': { type: '凶', desc: '庚加乙为奇格，刚柔相激，强者受制。' },
    '悖格': { type: '凶', desc: '丙加辛为悖格，主悖逆、口舌、是非争端。' },
    '三奇入墓': { type: '凶', desc: '三奇入墓，光华不显，谋事迟滞。' },
    '三奇受制': { type: '凶', desc: '三奇受克，吉事减力，宜守不宜进。' },
    '六仪击刑': { type: '凶', desc: '六仪击刑，主刑伤、官非、意外之扰。' }
  };

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function daysInMonth(y, m) {
    return new Date(y, m, 0).getDate();
  }

  function normalizeGod(god) {
    return god === '腾蛇' ? '螣蛇' : (god || '');
  }

  function unique(arr) {
    var out = [], seen = {};
    for (var i = 0; i < arr.length; i++) {
      var v = arr[i];
      if (!v || seen[v]) continue;
      seen[v] = 1;
      out.push(v);
    }
    return out;
  }

  /** 某宫格局（十干克应 + 特殊格局），返回 [{name, type, desc, source}] */
  function palaceGeJu(g, p, chart, ctx) {
    if (g === 5) return [];
    var list = [];
    var ke = Q.getPalaceKeYing(p.skyStem, p.earthStem, p.hiddenStems || [], p.jiGanStem) || [];
    ke.forEach(function (r) {
      list.push({ name: r.name, type: r.type || '', desc: r.desc || '', source: r.source || '' });
    });
    var special = Q.detectSpecialPatterns(
      g, p.earthStem, p.skyStem, p.door, p.star, p.god,
      chart.zhiShiDoor, ctx.dayGan, ctx.yearGan, ctx.monthGan
    ) || [];
    special.forEach(function (name) {
      var data = null;
      try { data = Q.getGeJuByName(name); } catch (e) { data = null; }
      var note = SPECIAL_NOTE[name] || null;
      list.push({
        name: name,
        type: data ? (data.isAuspicious ? '吉' : '凶') : (note ? note.type : ''),
        desc: (data && data.desc) || (note && note.desc) || '',
        source: '格局'
      });
    });
    /* 去重（同名保留首条） */
    var seen = {}, out = [];
    list.forEach(function (r) {
      if (seen[r.name]) return;
      seen[r.name] = 1;
      out.push(r);
    });
    return out;
  }

  /**
   * 排盘主函数
   */
  function compute(y, mo, d, h, mi) {
    if (!Q) throw new Error('奇门排盘引擎未加载');
    if (!global.Solar) throw new Error('历法库 lunar-javascript 未加载');

    y = parseInt(y, 10); mo = parseInt(mo, 10); d = parseInt(d, 10);
    h = parseInt(h, 10); mi = parseInt(mi, 10);

    if (!(y >= 1900 && y <= 2100)) throw new Error('年份需在 1900 – 2100 之间');
    if (!(mo >= 1 && mo <= 12)) throw new Error('月份需在 1 – 12 之间');
    var dim = daysInMonth(y, mo);
    if (!(d >= 1 && d <= dim)) throw new Error('该月只有 ' + dim + ' 天');
    if (!(h >= 0 && h <= 23)) throw new Error('小时需在 0 – 23 之间');
    if (!(mi >= 0 && mi <= 59)) throw new Error('分钟需在 0 – 59 之间');

    var solar = global.Solar.fromYmdHms(y, mo, d, h, mi, 0);
    var lunar = solar.getLunar();

    /* 23:00 起算次日子时 */
    var lateZi = h >= 23;
    var effLunar = lateZi ? solar.next(1).getLunar() : lunar;

    var dayGz = effLunar.getDayInGanZhi();
    var dayGan = dayGz.charAt(0), dayZhi = dayGz.charAt(1);
    var hourGz = lunar.getTimeInGanZhi();
    var hourGan = hourGz.charAt(0), hourZhi = hourGz.charAt(1);

    /* 节气以真实交节时刻为准（不使用真太阳时） */
    var jq = lunar.getPrevJieQi(false);
    var jqName = jq.getName();

    /* 拆补法取局：23 点后日柱已进位，故 hour 传 0，避免二次进位 */
    var ju = Q.chaiBuJuByGanZhi(jqName, dayGan, dayZhi, lateZi ? 0 : h);

    var yearGz = (lunar.getYearInGanZhiExact ? lunar.getYearInGanZhiExact() : lunar.getYearInGanZhi());
    var monthGz = (lunar.getMonthInGanZhiExact ? lunar.getMonthInGanZhiExact() : lunar.getMonthInGanZhi());

    var fourPillars = {
      year: { gan: yearGz.charAt(0), zhi: yearGz.charAt(1) },
      month: { gan: monthGz.charAt(0), zhi: monthGz.charAt(1) },
      day: { gan: dayGan, zhi: dayZhi },
      hour: { gan: hourGan, zhi: hourZhi }
    };

    var chart = Q.shiJiaGenerate(
      hourGan, hourZhi, ju.juNumber,
      ju.isYangDun ? 'yang' : 'yin',
      fourPillars, jqName
    );

    var lunarStr = effLunar.getYearInGanZhi() + '年 ' +
      (effLunar.getMonth() < 0 ? '闰' : '') +
      effLunar.getMonthInChinese() + '月' + effLunar.getDayInChinese();

    var yima = YI_MA[hourZhi] || '';
    var kongWang = chart.kongWang || [];

    /* 中五宫地盘干（寄宫干）——中五寄坤二、天禽寄天芮，此干同时出现在坤二宫与天芮落宫 */
    var zhongStem = (chart.palaces[4] && chart.palaces[4].skyStem) || '';
    var jiTarget = chart.jiGongArrow ? chart.jiGongArrow.palace : 0;

    var ctx = {
      dayGan: dayGan, yearGan: fourPillars.year.gan, monthGan: fourPillars.month.gan,
      kongWang: kongWang, yima: yima
    };

    var palaces = [];
    for (var g = 1; g <= 9; g++) {
      var p = chart.palaces[g - 1];
      var meta = PALACE_META[g];
      var isCenter = g === 5;
      var kong = isCenter ? '' : meta.branches.filter(function (b) {
        return kongWang.indexOf(b) >= 0;
      }).join('');
      var ma = (!isCenter && BRANCH_PALACE[yima] === g) ? yima : '';
      var gj = palaceGeJu(g, p, chart, ctx).map(function (x) { return x.name; });

      palaces.push({
        gongId: g,
        position: meta.name,
        fangWei: meta.dir,
        tianGan: isCenter ? '' : (p.earthStem || ''),
        yinGan: isCenter ? null : (p.skyStem || ''),
        xing: isCenter ? null : (p.star || null),
        men: isCenter ? null : (p.door || null),
        shen: isCenter ? null : (normalizeGod(p.god) || null),
        kongWang: kong,
        yiMa: ma,
        geJu: gj
      });
    }

    var json = {
      meta: {
        version: '1.0',
        type: '时家奇门',
        qifa: '拆补法',
        trueSunTime: false
      },
      baseTime: {
        gregorian: y + '-' + pad2(mo) + '-' + pad2(d) + ' ' + pad2(h) + ':' + pad2(mi) + ':00',
        lunar: lunarStr,
        ganZhiYear: yearGz,
        ganZhiMonth: monthGz,
        ganZhiDay: dayGz,
        ganZhiHour: hourGz,
        shiChen: hourZhi + '时'
      },
      juInfo: {
        juNum: ju.juNumber,
        juYinYang: ju.isYangDun ? '阳遁' : '阴遁',
        zhiFuGongId: chart.zhiFuPalace,
        zhiShiGongId: chart.zhiShiPalace
      },
      palaces: palaces
    };

    return {
      json: json,
      raw: chart,
      info: {
        solarTerm: jqName,
        solarTermTime: jq.getSolar().toYmdHms(),
        juNum: ju.juNumber,
        yuan: ju.yuan,
        dun: ju.isYangDun ? '阳遁' : '阴遁',
        zhiFuStar: chart.zhiFuStar,
        zhiFuPalace: chart.zhiFuPalace,
        zhiShiDoor: chart.zhiShiDoor,
        zhiShiPalace: chart.zhiShiPalace,
        kongWang: kongWang,
        yiMa: yima,
        zhongStem: zhongStem,
        jiTarget: jiTarget,
        lateZi: lateZi,
        lunar: lunarStr,
        pillars: fourPillars,
        input: { y: y, mo: mo, d: d, h: h, mi: mi }
      }
    };
  }

  /** 宫位详情（用于弹窗，含 JSON 之外的盘面信息） */
  function palaceDetail(g, result) {
    var raw = result.raw.palaces[g - 1];
    var json = result.json.palaces[g - 1];
    var isCenter = g === 5;
    var geju = isCenter ? [] : palaceGeJu(g, raw, result.raw, {
      dayGan: result.json.baseTime.ganZhiDay.charAt(0),
      yearGan: result.json.baseTime.ganZhiYear.charAt(0),
      monthGan: result.json.baseTime.ganZhiMonth.charAt(0),
      kongWang: result.info.kongWang,
      yima: result.info.yiMa
    });
    return {
      json: json,
      raw: raw,
      meta: PALACE_META[g],
      geju: geju,
      isCenter: isCenter,
      isZhiFu: result.info.zhiFuPalace === g,
      isZhiShi: result.info.zhiShiPalace === g
    };
  }

  global.QimenApp = {
    compute: compute,
    palaceDetail: palaceDetail,
    PALACE_META: PALACE_META,
    SPECIAL_NOTE: SPECIAL_NOTE
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ------------------------------------------------------------------
 * 奇门遁甲 · 时家拆补 —— 界面逻辑
 * ------------------------------------------------------------------ */
(function () {
  'use strict';

  var app = window.QimenApp;
  var Q = window.BigFishMarquisQimen;

  var current = null;
  var GRID = [4, 9, 2, 3, 5, 7, 8, 1, 6];   /* 洛书九宫：巽4 离9 坤2 / 震3 中5 兑7 / 艮8 坎1 乾6 */
  var NUM_CN = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
  var WX_CLASS = {
    '甲': 'mu', '乙': 'mu', '丙': 'huo', '丁': 'huo', '戊': 'tu',
    '己': 'tu', '庚': 'jin', '辛': 'jin', '壬': 'shui', '癸': 'shui'
  };

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function brief(text, limit) {
    if (!text) return '';
    var t = String(text).replace(/\s+/g, ' ').trim();
    var i = t.indexOf('。');
    if (i > 0 && i <= limit) return t.slice(0, i + 1);
    return t.length > limit ? t.slice(0, limit) + '…' : t;
  }

  function clip(text, limit) {
    if (!text) return '';
    var t = String(text).replace(/\s+/g, ' ').trim();
    return t.length > limit ? t.slice(0, limit) + '…' : t;
  }

  function nowParts() {
    var d = new Date();
    return { y: d.getFullYear(), mo: d.getMonth() + 1, d: d.getDate(), h: d.getHours(), mi: d.getMinutes() };
  }

  function setInputs(p) {
    $('in-year').value = p.y;
    $('in-month').value = p.mo;
    $('in-day').value = p.d;
    $('in-hour').value = p.h;
    $('in-minute').value = p.mi;
  }

  function readInputs() {
    return {
      y: $('in-year').value,
      mo: $('in-month').value,
      d: $('in-day').value,
      h: $('in-hour').value,
      mi: $('in-minute').value
    };
  }

  function setHint(text, isErr) {
    var h = $('hint');
    h.className = 'hint' + (isErr ? ' err' : '');
    h.textContent = text;
    if (!isErr) {
      var info = current && current.info;
      if (info && info.lateZi) h.textContent = text + ' · 已按次日子时';
    }
  }

  /* ---------------- 盘面 ---------------- */
  function cellHTML(p, raw, info) {
    var g = p.gongId;
    var meta = app.PALACE_META[g];
    var center = g === 5;
    var tag = '';
    if (info.zhiFuPalace === g && info.zhiShiPalace === g) tag = '符使';
    else if (info.zhiFuPalace === g) tag = '值符';
    else if (info.zhiShiPalace === g) tag = '值使';

    var h = '<button class="cell' + (center ? ' center' : '') + '" type="button" data-g="' + g +
      '" aria-label="' + meta.name + '，点击查看详解">';
    h += '<span class="wm">' + meta.gua + '</span>';
    if (tag && !center) h += '<span class="tag">' + tag + '</span>';

    if (center) {
      var ji = (info.jiGong || 0) ? ('寄' + app.PALACE_META[info.jiGong].short + '宫') : '寄坤二宫';
      h += '<span class="cell-in">' +
        '<span class="row"><b class="tian ' + (WX_CLASS[raw.skyStem] || '') + '">' + esc(raw.skyStem || '—') + '</b><i class="god">地盘</i></span>' +
        '<span class="row mid"><i class="star">天禽</i></span>' +
        '<span class="row bot"><i class="di">' + ji + '</i></span>' +
        '</span>';
    } else {
      var chips = (raw.marks || []).slice().map(function (m) { return { t: m, ji: false }; });
      (raw.jiMarks || []).forEach(function (m) { chips.push({ t: '寄' + m, ji: false }); });
      if (info.zhongStem && (g === 2 || g === info.jiTarget)) {
        chips.push({ t: '隐' + info.zhongStem, ji: true });
      }
      var mk = chips.length ? '<span class="marks">' + chips.map(function (c) {
        return '<i' + (c.ji ? ' class="ji"' : '') + '>' + esc(c.t) + '</i>';
      }).join('') + '</span>' : '';

      h += '<span class="cell-in">' +
        '<span class="row"><b class="tian ' + (WX_CLASS[p.tianGan] || '') + '">' + esc(p.tianGan || '—') + '</b>' +
        '<i class="god">' + esc(p.shen || '') + '</i></span>' +
        '<span class="row mid"><i class="star">' + esc(p.xing || '') + '</i>' + mk + '</span>' +
        '<span class="row bot"><b class="men">' + esc(p.men || '') + '</b><i class="di">' + esc(p.yinGan || '') + '</i></span>' +
        '</span>';
    }
    h += '<span class="gname">' + meta.short + '宫</span></button>';
    return h;
  }

  function renderHead(info) {
    var p = info.pillars;
    var chips = [];
    chips.push('<span class="chip">' + esc(info.solarTerm) + ' · ' + esc(info.yuan) + '元</span>');
    chips.push('<span class="chip">值符 ' + esc(info.zhiFuStar) + ' · ' + app.PALACE_META[info.zhiFuPalace].short + '宫</span>');
    chips.push('<span class="chip">值使 ' + esc(info.zhiShiDoor) + ' · ' + app.PALACE_META[info.zhiShiPalace].short + '宫</span>');
    chips.push('<span class="chip">空亡 ' + (info.kongWang.join('') || '无') + '</span>');
    chips.push('<span class="chip">驿马 ' + (info.yiMa || '无') + '</span>');
    if (info.lateZi) chips.push('<span class="chip warn">已按次日子时</span>');

    return '<span class="pillars">' +
      esc(p.year.gan + p.year.zhi + '年') + '　' +
      esc(p.month.gan + p.month.zhi + '月') + '　' +
      esc(p.day.gan + p.day.zhi + '日') + '　' +
      esc(p.hour.gan + p.hour.zhi + '时') +
      '</span>' +
      '<span class="ju">' + esc(info.dun + NUM_CN[info.juNum] + '局') + '</span>' +
      '<span class="chips">' + chips.join('') + '</span>';
  }

  function render(result) {
    current = result;
    var json = result.json;
    var info = result.info;

    $('chartHead').innerHTML = renderHead(info);

    var map = {};
    json.palaces.forEach(function (p) { map[p.gongId] = p; });
    var rawMap = {};
    result.raw.palaces.forEach(function (p) { rawMap[p.palaceNumber] = p; });

    var info2 = {
      zhiFuPalace: info.zhiFuPalace,
      zhiShiPalace: info.zhiShiPalace,
      jiGong: result.raw.jiGongArrow ? result.raw.jiGongArrow.palace : 0,
      zhongStem: info.zhongStem,
      jiTarget: info.jiTarget
    };

    $('plate').innerHTML = GRID.map(function (g) {
      return cellHTML(map[g], rawMap[g], info2);
    }).join('');

    window.QimenResult = json;

    setHint('23:00 之后按次日子时起局 · 不使用真太阳时 · 仅拆补法');
  }

  function run() {
    try {
      var v = readInputs();
      var result = app.compute(v.y, v.mo, v.d, v.h, v.mi);
      render(result);
    } catch (e) {
      setHint(e.message || String(e), true);
    }
  }

  /* ---------------- 弹窗 ---------------- */
  var lastFocus = null;

  function typeClass(t) {
    if (!t) return 'ping';
    if (t.indexOf('吉') >= 0) return 'ji';
    if (t.indexOf('凶') >= 0) return 'xiong';
    return 'ping';
  }

  function item(label, value, dim) {
    return '<div class="m-item"><em>' + esc(label) + '</em><b class="' + (dim ? 'dim' : '') + '">' +
      esc(value == null || value === '' ? '—' : value) + '</b></div>';
  }

  function openPalace(g) {
    if (!current) return;
    var d = app.palaceDetail(g, current);
    var raw = d.raw, j = d.json, meta = d.meta, info = current.info;

    var starD = raw.star ? Q.getStarDetail(raw.star) : null;
    var doorD = raw.door ? Q.getDoorDetail(raw.door) : null;
    var godKey = raw.god === '腾蛇' ? '螣蛇' : raw.god;
    var godD = raw.god ? (Q.getGodDetail(raw.god) || Q.getGodDetail(godKey)) : null;
    var gongD = Q.getPalaceDetail(g);

    var h = '';
    h += '<div class="m-head">';
    h += '<div class="m-title" id="mTitle">' + meta.name +
      '<small>' + meta.dir + ' · ' + esc(raw.palaceElement || '') + ' · ' + esc(gongD ? (gongD.卦名 || '') : '') + '</small></div>';
    var badges = [];
    if (d.isZhiFu) badges.push('<span class="m-badge">值符落宫</span>');
    if (d.isZhiShi) badges.push('<span class="m-badge">值使落宫</span>');
    if (j.kongWang) badges.push('<span class="m-badge gold">空亡 ' + j.kongWang + '</span>');
    if (j.yiMa) badges.push('<span class="m-badge gold">驿马 ' + j.yiMa + '</span>');
    if (badges.length) h += '<div class="m-badges">' + badges.join('') + '</div>';
    h += '</div>';

    /* 基础信息 */
    var marks = (raw.marks || []).slice();
    (raw.jiMarks || []).forEach(function (m) { marks.push('寄' + m); });

    h += '<div class="m-grid">';
    if (d.isCenter) {
      h += item('地盘干', raw.skyStem);
      h += item('九星', '天禽', true);
      h += item('寄宫', d.isCenter ? (current.raw.jiGongArrow ? (app.PALACE_META[current.raw.jiGongArrow.palace].short + '宫') : '坤二宫') : '');
      h += item('暗干', (raw.hiddenStems && raw.hiddenStems[0]) || '');
      h += item('宫位标记', marks.join(' ') || '—', !marks.length);
    } else {
      h += item('天盘干', raw.earthStem);
      h += item('地盘干', raw.skyStem);
      h += item('暗干', (raw.hiddenStems && raw.hiddenStems[0]) || '');
      h += item('九星', raw.star + (starD ? '（' + starD.五行 + '）' : ''));
      h += item('八门', raw.door + (doorD ? '（' + doorD.五行 + '）' : ''));
      h += item('八神', j.shen);
      if (raw.diGod) h += item('地八神', raw.diGod);
      var zhong = info.zhongStem || (current.raw.palaces[4] ? current.raw.palaces[4].skyStem : '');
      if (zhong && g === 2) h += item('隐干（中五寄坤二）', zhong);
      if (zhong && g === info.jiTarget && g !== 2) h += item('隐干（天禽寄天芮）', zhong);
      h += item('空亡', j.kongWang || '无', !j.kongWang);
      h += item('驿马', j.yiMa || '无', !j.yiMa);
      h += item('宫位标记', marks.join(' ') || '无', !marks.length);
    }
    h += '</div>';

    /* 格局 */
    h += '<div class="m-sec"><h4>格局</h4>';
    if (d.geju.length) {
      h += '<ul class="gj">' + d.geju.map(function (r) {
        return '<li><div class="gj-t"><span class="gj-name">' + esc(r.name) + '</span>' +
          (r.type ? '<span class="gj-type ' + typeClass(r.type) + '">' + esc(r.type) + '</span>' : '') +
          (r.source ? '<span class="gj-src">' + esc(r.source) + '</span>' : '') +
          '</div>' + (r.desc ? '<p>' + esc(brief(r.desc, 120)) + '</p>' : '') + '</li>';
      }).join('') + '</ul>';
    } else {
      h += '<p class="empty">' + (d.isCenter ? '中五宫为寄宫之所，不列八门八神，格局以寄宫论。' : '本宫无明显格局。') + '</p>';
    }
    h += '</div>';

    /* 释义 */
    h += '<div class="m-sec"><h4>简释</h4>';
    if (gongD) {
      h += '<p><em>宫位</em>' + esc(clip(gongD.卦性, 112)) + '</p>';
    }
    if (starD) {
      h += '<p><em>九星</em>' + esc(raw.star) + '：' + esc(clip(starD.吉凶, 92)) + '</p>';
      if (starD.万物类象 && starD.万物类象.概念) {
        h += '<p><em>类象</em>' + esc(clip(starD.万物类象.概念, 72)) + '</p>';
      }
    }
    if (doorD) {
      h += '<p><em>八门</em>' + esc(raw.door) + '：' + esc(clip(doorD.吉凶, 84)) + '</p>';
    }
    if (godD) {
      h += '<p><em>八神</em>' + esc(j.shen) + '：' + esc(clip(godD.神性, 104)) + '</p>';
    }
    h += '</div>';

    if (info.lateZi) {
      h += '<div class="m-sec"><h4>说明</h4><p>所取时刻在 23:00 之后，已按次日子时起局。</p></div>';
    }

    $('mBody').innerHTML = h;
    var mask = $('mask');
    mask.hidden = false;
    mask.classList.add('on');
    document.body.style.overflow = 'hidden';
    lastFocus = document.activeElement;
    $('mClose').focus();
  }

  function closeModal() {
    var mask = $('mask');
    mask.classList.remove('on');
    mask.hidden = true;
    document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    if (!app || !Q) {
      setHint('排盘引擎未加载', true);
      return;
    }
    setInputs(nowParts());
    run();

    $('btn-now').addEventListener('click', function () {
      setInputs(nowParts());
      run();
    });
    $('btn-run').addEventListener('click', run);

    Array.prototype.forEach.call(document.querySelectorAll('.field input'), function (input) {
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); run(); }
      });
    });

    $('plate').addEventListener('click', function (e) {
      var cell = e.target.closest ? e.target.closest('.cell') : null;
      if (cell) openPalace(parseInt(cell.getAttribute('data-g'), 10));
    });

    $('mClose').addEventListener('click', closeModal);
    $('mask').addEventListener('click', function (e) {
      if (e.target === $('mask')) closeModal();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && $('mask').classList.contains('on')) closeModal();
    });
  }

  window.__qimenBoot = boot;
})();

</script>
<script>
/* ---------- 历法库加载（国内 CDN，多源回退） ---------- */
(function () {
  var urls = [
    'https://registry.npmmirror.com/lunar-javascript/1.7.8/files/lunar.js',
    'https://lib.baomitu.com/lunar-javascript/1.7.8/lunar.js',
    'https://cdn.bootcdn.net/ajax/libs/lunar-javascript/1.6.13/lunar.js'
  ];
  var i = 0;
  function fail(msg) {
    var h = document.getElementById('hint');
    if (h) { h.className = 'hint err'; h.textContent = msg; }
    var p = document.getElementById('plate');
    if (p) p.innerHTML = '<div style="grid-column:1/-1;padding:40px 16px;text-align:center;font-size:13px;line-height:2;color:#8b8069">历法库加载失败，请检查网络后刷新页面。<br />（历法脚本来自国内 CDN：npmmirror / 360 / BootCDN）</div>';
  }
  function next() {
    if (window.Solar) {
      try { window.__qimenBoot(); } catch (e) { fail('初始化失败：' + e.message); }
      return;
    }
    if (i >= urls.length) { fail('历法库加载失败，无法排盘。'); return; }
    var s = document.createElement('script');
    s.src = urls[i++];
    s.async = false;
    s.onload = next;
    s.onerror = next;
    document.head.appendChild(s);
  }
  next();
})();
</script>
